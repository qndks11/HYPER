/**:
  ros__parameters:
    # Body params (헤네스 브룬 T8 Sport 실측 제원 기반)
    body_length: 1.33 # 차량 실제 전장 (실측) [m]
    body_width: 0.77 # 차량 실제 전폭 (실측) [m]
    body_height: 0.40 # 차량 전고 기준 섀시/프레임 근사 높이 [m]
    body_density: 150.0 # 차체가 플라스틱(ABS) 내부 프레임 위주이므로, 실중량(약 30~35kg)에 맞춰 밀도 대폭 하향 [kg/m^3]

    # Wheel params (T8 Sport 대형 우레탄/고무 타이어 기준)
    wheel_radius: 0.2 # 실제 바퀴 지름 약 26cm -> 반지름 13cm [m]
    wheel_width: 0.09 # 바퀴 단면 폭 약 9cm [m]
    wheel_density: 950.0 # 발포 우레탄 및 고무 내외륜 밀도 [kg/m^3]

    # Kinematics and dynamics params
    max_steering_angle: 0.5061455 # 최대 조향각 29도 (실측) [rad]
    max_steering_angular_velocity: 2.0 # 고성능 조향 모터/서보 반영으로 상향 [rad/s]
    max_steering_effort: 15.0 # 대형 차체를 돌리기 위한 조향 토크 상향 [Nm]
    max_velocity: 1.0 # 저속 테스트용으로 하향 (원래 T8 Sport 순정 최고 속도는 약 16km/h=10.0) [m/s]
    max_effort: 30.0 # 24V 듀얼 모터의 구동력을 반영하여 토크 상향 [Nm]

    # Camera and image params (ELP 2MP Global Shutter Fisheye AR0234, 153-degree hfov)
    camera_box_size: 0.05 # 카메라 하우징 크기 [m]
    # camera_height: body_link 기준. 실측(2026-08-30): 지면 기준 1.27 m - 라이드 하이트
    # 0.171 m = 1.099 m. 지면 기준 원본 값은 hyper_lane_detection/config/bev_real.yaml 참고.
    camera_height: 1.099 # [m]
    camera_pitch: 0.192 # 실측(2026-08-30). 약 11도 하향 [rad]
    camera_setback: 0.64 # 실측(2026-08-30): 차량 앞단(범퍼)에서 카메라까지 뒤로 간 거리 [m]
    camera_fov: 2.67 # 153 deg hfov.
    camera_fps: 30 # [Hz]
    image_width: 640 # 실제 센서 1920x1200에서 1/3로 축소, 16:10 비율 유지 [pixels]
    image_height: 400 # 실제 센서 1920x1200에서 1/3로 축소, 16:10 비율 유지 [pixels]

    # Object detection camera params (normal 70 deg hfov, front-facing, for traffic light/sign detection)
    # object_camera_height: body_link 기준. 실측(2026-08-30): 지면 기준 1.283 m - 라이드 하이트
    # 0.171 m = 1.112 m. object_detection_node는 지면 투영을 안 하므로(픽셀 박스 분류만 함)
    # 이 값 자체가 실주행에 쓰이진 않고 문서화/시뮬레이션 목적입니다.
    object_camera_height: 1.112 # [m]
    object_camera_pitch: 0.087 # 실측(2026-08-30). 약 5도 하향 [rad]
    object_camera_setback: 0.527 # 실측(2026-08-30): 차량 앞단(범퍼)에서 카메라까지 뒤로 간 거리 [m]
    object_camera_fov: 1.2217305 # 70 deg hfov (일반 렌즈, 어안 왜곡 없음)
