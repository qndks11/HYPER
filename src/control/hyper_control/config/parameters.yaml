/**:
  ros__parameters:
    # Body params (헤네스 브룬 T8 Sport 실측 제원 기반)
    body_length: 1.33 # 차량 실제 전장 (실측) [m]
    body_width: 0.77 # 차량 실제 전폭 (실측) [m]
    body_height: 0.40 # 차량 전고 기준 섀시/프레임 근사 높이 [m]
    body_density: 150.0 # 차체가 플라스틱(ABS) 내부 프레임 위주이므로, 실중량(약 30~35kg)에 맞춰 밀도 대폭 하향 [kg/m^3]

    # 전/후 차축 간 거리 (실측). body_length와 별개 값이므로 명시적으로 지정해야
    # 시뮬레이터 Ackermann 기구학이 실차와 일치한다. nav2_controller.yaml / hyper_interface와 동일.
    wheel_base: 0.72 # [m]

    # Wheel params (T8 Sport 대형 우레탄/고무 타이어 기준)
    wheel_radius: 0.2 # 실제 바퀴 지름 약 26cm -> 반지름 13cm [m]
    wheel_width: 0.09 # 바퀴 단면 폭 약 9cm [m]
    wheel_density: 950.0 # 발포 우레탄 및 고무 내외륜 밀도 [kg/m^3]

    # Kinematics and dynamics params
    max_steering_angle: 0.5061455 # 최대 조향각 29도 (실측) [rad]
    max_steering_angular_velocity: 2.0 # 고성능 조향 모터/서보 반영으로 상향 [rad/s]
    max_steering_effort: 15.0 # 대형 차체를 돌리기 위한 조향 토크 상향 [Nm]
    max_velocity: 2.2 # 저속 테스트용으로 하향 (원래 T8 Sport 순정 최고 속도는 약 16km/h=10.0) [m/s]
    max_effort: 30.0 # 24V 듀얼 모터의 구동력을 반영하여 토크 상향 [Nm]

    # Camera and image params (Logitech C920, 일반 70도 hfov 렌즈, 전방)
    #
    # 차량 카메라는 이 한 대뿐이고 차선 인식(BEV 워프)과 객체 인식(YOLO)이 같이 씁니다.
    # 예전에는 차선용 ELP 어안(153도) + 객체용 C920 두 대였고, 아래 값들은 그중 C920
    # 마운트의 실측값입니다 (예전 object_camera_* 항목이 여기로 올라왔습니다).
    camera_box_size: 0.05 # 카메라 하우징 크기 [m]
    # camera_height: body_link 기준. 실측(2026-08-30): 지면 기준 1.283 m - 라이드 하이트
    # 0.171 m = 1.112 m. 지면 기준 원본 값은 hyper_lane_detection/config/bev_real.yaml 참고.
    camera_height: 1.112 # [m]
    camera_pitch: 0.087 # 실측(2026-08-30). 약 5도 하향 [rad]
    camera_setback: 0.527 # 실측(2026-08-30): 차량 앞단(범퍼)에서 카메라까지 뒤로 간 거리 [m]
    camera_fov: 1.2217305 # 70 deg hfov (일반 렌즈, 어안 왜곡 없음)
    camera_fps: 30 # [Hz]
    # 실차 캡처 해상도(hyper_camera의 LogitechCameraPublisherNode)와 똑같이 맞춥니다.
    # 세로 크기가 BEV의 근거리 경계를 정하므로(수직 화각 -> 맨 아랫줄이 지면에 닿는 거리),
    # 시뮬레이터가 다른 종횡비로 렌더링하면 실차와 다른 BEV가 나옵니다.
    image_width: 640 # 센서 1280x720의 1/2, 16:9 유지 [pixels]
    image_height: 360 # 센서 1280x720의 1/2, 16:9 유지 [pixels]
