label_snap_tolerance_m: 1.0

# 실제 최악 이음매는 end_left의 1.04 m입니다(common_3 끝 -> end_left 첫 점).
branch_seam_tolerance_m: 2.0

# waypoint studio가 배경으로 까는 항공사진입니다. mission_manager는 이 키를 읽지 않습니다.
# 파일 이름만 적으면 스튜디오가 (1) 이 yaml의 폴더, (2) ~/HYPER, (3) hyper_gazebo의
# meshes/ 순으로 찾습니다. 배치(중심/가로 폭/회전)는 옆의 <이미지>.align.yaml에 있습니다.
background: real_course.png

# 이 미션에는 main 코스가 없습니다 -- 트랙이 조각으로 녹화되어 있어 "이 미션이 달리는
# 코스" 하나를 고를 수 없기 때문입니다. 그래서 최상위 labels: 블록도 없고(그건 main의
# 것입니다), 라벨은 코스마다 courses.<이름>.labels에, CSV 경로는 코스마다 waypoints/
# 기준으로(track/common_1.csv) 적습니다. 모든 drive 스텝은 course:를 명시해야 합니다.
courses:
  # 1) 출발 갈래. 차를 어느 출발선에 놓았느냐로 정해집니다(start_branch).
  #    두 CSV 모두 정지선이 하나씩 있고, 끝에서 common_1으로 합류합니다.
  start_left:
    csv: track/start_left.csv
    # stopline_left: PLACEHOLDER -- 좌측 출발 정지선으로 옮길 것.
    # start_left_end가 last가 아닌 이유: 마지막 점(#121)의 yaw가 2.564로, 이웃
    # (#117~120: -0.886 -> -0.684)과 약 173도 어긋난 녹화 오류입니다. 골 포즈가 뒤집힌
    # 헤딩을 물고 가지 않도록 한 점 앞(#120)에서 끊습니다. CSV를 고치면 last로 되돌리세요.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      stopline_left: {x: 3.028, y: 27.858}   # wp #52
      start_left_end: {x: -28.716, y: 13.809}   # wp #120
      
  start_right:
    csv: track/start_right.csv
    # stopline_right: PLACEHOLDER -- 우측 출발 정지선으로 옮길 것.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      stopline_right: {x: 4.341, y: 30.910}   # wp #41
      start_right_end: {x: -29.300, y: 14.054}   # wp #121

  common_1:
    csv: track/common_1.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      light_1: {x: -0.846, y: 1.740}   # wp #68
      s_curve_start: {x: -23.101, y: -23.846}   # wp #136
      s_curve_end: {x: -43.334, y: -1.138}   # wp #183
      cone_2: {x: 5.037, y: -17.705}   # wp #262
      park_t_entry: {x: -2.297, y: -35.820}   # wp #287
      light_2: {x: -12.994, y: -6.010}   # wp #228, orphan: 어떤 step도 참조하지 않음

  # 2) T자 주차 갈래. 두 CSV 모두 common_1의 끝(park_t_entry)에서 *후진으로* 시작합니다
  #    -- 녹화가 그렇게 되어 있습니다(t_left #0~23, t_right #0~24가 후진 구간). 그래서
  #    갈래의 첫 스텝이 RRPP이고, 칸 안의 방향 전환점이 *_spot 라벨입니다.
  t_left:
    csv: track/t_left.csv
    # t_left_spot은 후진 끝(방향 전환점)입니다 -- wp #23.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      t_left_spot: {x: 9.130, y: -32.359}   # wp #23
      t_left_end: last
  t_right:
    csv: track/t_right.csv
    # t_right_spot은 후진 끝(방향 전환점)입니다 -- wp #24.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      t_right_spot: {x: 10.209, y: -30.443}   # wp #24
      t_right_end: last

  # 3) T자 주차 뒤의 공통 구간. 신호등 -> 가속 구간 -> 평행 주차 진입까지입니다.
  common_2:
    csv: track/common_2.csv
    # 정지선, 가속 구간 시작선, 가속 구간 종료선으로 옮길 것.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      light_3: {x: -5.245, y: -19.289}   # wp #98
      accel_start: {x: -53.250, y: -26.930}   # wp #227
      accel_end: {x: 2.155, y: -49.931}   # wp #300
      park_p_entry: last

  # 4) 평행 주차 갈래. 두 CSV의 모양이 다릅니다.
  #    p_up   : 전진 #0~8 -> 후진 #8~23 -> 전진 #23~41 (진입 스텝이 하나 더 있습니다)
  #    p_down : 후진 #0~9 -> 전진 #9~30 (첫 점부터 이미 후진입니다)
  p_up:
    csv: track/p_up.csv
    # p_up_entry(wp #8)에서 후진으로 바뀌고, p_up_spot(wp #23)이 칸 안 방향 전환점입니다.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      p_up_entry: {x: 12.908, y: -10.057}   # wp #8
      p_up_spot: {x: 20.226, y: -7.118}   # wp #23
      p_up_end: last
  p_down:
    csv: track/p_down.csv
    # p_down_spot은 칸 안 방향 전환점입니다 -- wp #9.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      p_down_spot: {x: 28.049, y: -10.336}   # wp #9
      p_down_end: {x: 9.999, y: -10.039}   # wp #30

  # 5) 주차 뒤 합류 구간과 마지막 차선 갈래.
  common_3:
    csv: track/common_3.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      common_3_end: {x: 18.763, y: 0.448}   # wp #48
  end_left:
    csv: track/end_left.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      end_left_end: {x: 31.025, y: 0.169}   # wp #18
  end_right:
    csv: track/end_right.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      end_right_end: {x: 29.570, y: -2.967}   # wp #15

keepout:
  # 진입 금지 구역(map 프레임 다각형, 꼭짓점 3개 이상). 이 블록은 waypoint studio가
  # 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
  - name: zone_0
    points: [[-39.27, 0.22], [-38.14, 0.28], [-37.09, 0.16], [-30.97, -1.48], [-24.60, -3.06], [-15.66, -6.79], [-13.64, -7.74], [-12.38, -8.35], [-11.58, -8.95], [-11.06, -9.59], [-10.42, -10.76], [-10.05, -11.40], [-10.10, -12.59], [-9.91, -15.03], [-10.33, -16.32], [-10.67, -17.26], [-11.76, -20.12], [-14.25, -26.49], [-14.99, -27.62], [-15.68, -28.24], [-16.91, -28.68], [-18.13, -28.90], [-19.31, -28.78], [-20.05, -28.38], [-20.52, -27.99], [-21.21, -27.45], [-21.48, -26.59], [-21.62, -25.76], [-21.58, -24.53], [-21.33, -23.54], [-21.03, -22.71], [-20.66, -21.77], [-20.46, -20.60], [-20.24, -19.22], [-20.57, -17.48], [-20.98, -15.44], [-22.21, -13.12], [-24.09, -11.29], [-25.59, -9.99], [-27.68, -9.22], [-29.48, -8.79], [-31.30, -8.70], [-32.95, -9.06], [-34.70, -9.63], [-36.59, -9.98], [-38.39, -9.65], [-40.24, -8.52], [-41.59, -6.95], [-42.17, -4.42], [-42.10, -2.84], [-41.46, -1.59], [-40.51, -0.36]]
  - name: zone_1
    points: [[-31.84, -27.06], [-31.67, -25.98], [-30.85, -24.07], [-30.11, -23.40], [-28.84, -22.79], [-27.21, -22.39], [-26.15, -22.22], [-25.64, -21.46], [-25.32, -20.48], [-25.03, -19.49], [-25.08, -18.05], [-25.30, -17.01], [-25.83, -16.01], [-26.26, -15.27], [-26.90, -14.80], [-27.76, -14.34], [-28.39, -13.97], [-29.48, -13.60], [-30.19, -13.54], [-31.42, -13.54], [-32.26, -13.67], [-32.94, -13.81], [-34.44, -14.19], [-35.33, -14.43], [-36.45, -14.48], [-37.60, -14.41], [-38.70, -14.15], [-39.61, -13.82], [-40.93, -13.31], [-41.90, -13.13], [-42.53, -12.73], [-43.14, -12.10], [-44.04, -11.28], [-44.68, -10.38], [-45.57, -9.09], [-46.51, -7.11], [-46.83, -5.06], [-46.84, -2.97], [-46.52, -1.24], [-46.00, -0.09], [-46.09, 0.51], [-46.56, 0.82], [-47.02, 0.69], [-47.52, 0.39], [-47.78, -0.35], [-49.71, -6.09], [-53.03, -14.16], [-53.51, -16.65], [-53.45, -17.56], [-53.21, -18.59], [-52.87, -19.66], [-52.24, -20.65], [-51.55, -21.08], [-50.66, -21.91], [-49.41, -22.43], [-48.46, -22.80], [-40.71, -25.68], [-37.73, -26.50], [-35.69, -26.81], [-33.69, -27.23], [-32.48, -27.44]]

# --- 미션 시퀀스 ---
steps:
  # [0] 출발 갈래. 표지가 아니라 차의 현재 위치로 고릅니다: start_left.csv의 첫 점과
  # start_right.csv의 첫 점 중 가까운 쪽입니다(두 출발선은 약 3 m 떨어져 있습니다).
  # cases를 남겨 둔 이유는 /perception/sign으로 손수 밀어 넣어 갈래를 강제할 수 있게
  # 하기 위해서입니다(위치 판정이 이기므로 평소에는 쓰이지 않습니다).
  # tf를 못 읽으면 timeout 뒤 default로 갑니다.
  - type: branch
    select_by: position
    default: start_right_route
    timeout_s: 5.0
    # debounce_frames도 vote_window_s도 적지 않습니다 -- 위치로 고르는 분기는 신호를
    # 아예 안 보므로 둘 다 쓰이지 않습니다.
    prearm_distance_m: 0.0      # 앞에 drive 스텝이 없습니다. 미리 볼 것도 없습니다.
    cases:
      - {value: "start_left",  goto: start_left_route}
      - {value: "start_right", goto: start_right_route}

  # [1~2] 합류 뒤 첫 신호등.
  - {type: drive, course: common_1, until: light_1, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  - {type: wait_signal, value: green, timeout_s: 120.0, debounce_frames: 3,
     prearm_distance_m: 12.0}

  # [3~5] s자 구간. 여기만 MPPI입니다 -- 연속 회피가 필요한 유일한 곳입니다.
  # 앞뒤 경계에서 서지 않도록 handoff_m으로 골을 갈아끼웁니다(컨트롤러 전환).
  # 이 세 스텝에 decel_profile_a / cancel_on_arrival_m이 없는 것은 실수가 아닙니다:
  # 둘 다 "라벨에서 선다"는 뜻이라 handoff와 같이 쓸 수 없습니다.
  - {type: drive, course: common_1, until: s_curve_start, controller: FRPP, handoff_m: 6.0}
  - {type: drive, course: common_1, until: s_curve_end, controller: MPPI, handoff_m: 6.0}
  # cone_2는 T주차 안내 표지를 읽는 지점입니다(판정은 아직 미구현 -- 아래 [7] 참고).
  # 라벨만 두고 그대로 통과합니다 -- ~/goto_step으로 이 구간부터 다시 달릴 때 씁니다.
  - {type: drive, course: common_1, until: cone_2, controller: FRPP, handoff_m: 6.0}

  # [6] T자 주차 갈림길까지. common_1은 여기서 끝납니다(park_t_entry = last).
  - {type: drive, course: common_1, until: park_t_entry, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}

  # [7] T자 주차 갈래.
  # !! 판정 조건이 아직 없습니다. 지금은 표지값을 그냥 기다리다 timeout 뒤 default로
  #    갑니다. 조건이 정해지면 cases의 value를 실제 표지값으로 바꾸거나(그러면 여기가
  #    그대로 동작합니다), 위치로 정해지는 것이면 [0]처럼 select_by: position을 쓰세요.
  #    timeout을 3초로 짧게 둔 것은 어차피 답이 안 나오기 때문입니다.
  # prearm_distance_m가 0인 것도 의도된 것입니다 -- 두 갈래 모두 후진으로 시작하므로
  # 골을 하나로 합칠 수 없어(방향 전환) 어차피 prearm이 꺼집니다.
  - type: branch
    select_by: clearance
    default: t_left_route
    timeout_s: 6.0
    vote_window_s: 2.0
    prearm_distance_m: 0.0
    cases:
      - {value: "t_left",   goto: t_left_route, cone: {x: 3.74, y: -31.85, radius: 1.0}}  
      - {value: "t_right", goto: t_right_route, cone: {x: 5.14, y: -27.40, radius: 1.0}}  

  # [8~9] 합류(common_2) 뒤 두 번째 신호등.
  - {type: drive, course: common_2, until: light_3, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  - {type: wait_signal, value: green, timeout_s: 120.0, debounce_frames: 3,
     prearm_distance_m: 12.0}

  # [10~11] 가속 구간. 여기는 원래부터 RPP여야 하는 곳입니다 -- 장애물 앞에서 비켜 가지
  # 않고 반드시 서야 합니다. obstacle_hold_s가 그 정지를 미션 실패가 아니라 대기로
  # 다룹니다(1초마다 같은 골을 다시 보내고, 30초 넘게 막혀 있으면 그때 실패).
  - {type: drive, course: common_2, until: accel_start, controller: FRPP,
     goal_checker: precise_goal_checker, handoff_m: 6.0}
  - {type: drive, course: common_2, until: accel_end, controller: FRPP,
     goal_checker: precise_goal_checker, obstacle_hold_s: 30.0,
     handoff_m: 6.0}

  # [12] 평행 주차 갈림길까지. common_2는 여기서 끝납니다(park_p_entry = last).
  - {type: drive, course: common_2, until: park_p_entry, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}

  # [13] 평행 주차 갈래. [7]과 같이 판정 조건이 아직 없습니다.
  - type: branch
    select_by: clearance
    default: p_up_route
    timeout_s: 6.0
    vote_window_s: 2.0
    prearm_distance_m: 0.0
    cases:
      - {value: "p_up",   goto: p_up_route,   cone: {x: 18.08, y: -9.59, radius: 1.0}}  
      - {value: "p_down", goto: p_down_route, cone: {x: 25.27, y: -12.55, radius: 1.0}}  

  # [14] 합류(common_3) -- 마지막 차선 갈림길까지.
  - {type: drive, course: common_3, until: common_3_end, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}

  # [15] 마지막 차선 갈래. 나란히 선 표지판 세 장 중 **왼쪽 두 장**을 object_detection이
  # 읽어 allow_left / allow_right로 냅니다(publish_lane_fork_sign). 표지판은 깜빡이지만
  # 한 칸이 꺼져 있어도(blank) 나머지 한 칸이 allow/ban이면 답이 정해지고, 판단은 아래
  # vote_window_s 동안 모은 표의 다수결이라 깜빡임에 끊기지 않습니다. 여기는 두 갈래 모두
  # 전진이고 컨트롤러도 앞 스텝과 같으므로 prearm이 걸립니다 -- 서지 않고 그대로
  # 갈래로 들어갑니다.
  - type: branch
    default: end_right_route
    timeout_s: 8.0
    vote_window_s: 5.0          # 이 시간 동안 모아 다수결. timeout_s보다 작아야 합니다.
    prearm_distance_m: 12.0
    cases:
      - {value: "allow_left",  goto: end_left_route}
      - {value: "allow_right", goto: end_right_route}

routes:
  # 출발 갈래: 정지선에서 5초 정차한 뒤 코스 끝까지. 끝나면 [1]로 합류합니다.
  start_left_route:
    - {type: drive, course: start_left, until: stopline_left, controller: FRPP,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
    - {type: stop, duration_s: 5.0}
    - {type: drive, course: start_left, until: start_left_end, controller: FRPP, handoff_m: 6.0}
  start_right_route:
    - {type: drive, course: start_right, until: stopline_right, controller: FRPP,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
    - {type: stop, duration_s: 5.0}
    - {type: drive, course: start_right, until: start_right_end, controller: FRPP, handoff_m: 6.0}

  # T자 주차: 분기 지점에서 곧바로 후진 입고 -> 정차 -> 전진 출차. 출차가 별도 갈래
  # 스텝인 이유는 RPP가 한 경로 안의 방향 전환을 처리하지 못하기 때문입니다.
  # 후진 스텝에는 cancel_on_arrival_m을 켜지 마세요 -- 짧게 서면 칸에 덜 들어갑니다.
  t_left_route:
    - {type: drive, course: t_left, until: t_left_spot, controller: RRPP,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: t_left, until: t_left_end, controller: FRPP}
  t_right_route:
    - {type: drive, course: t_right, until: t_right_spot, controller: RRPP,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: t_right, until: t_right_end, controller: FRPP}

  # 평행 주차. p_up만 진입 스텝이 하나 더 있습니다(녹화가 전진 -> 후진 -> 전진).
  # 진입 스텝의 cancel_on_arrival_m는 정지선(0.4)보다 작게 잡습니다: 진입에서 덜 간
  # 거리가 그대로 칸 안 정지 오차에 더해집니다.
  p_up_route:
    - {type: drive, course: p_up, until: p_up_entry, controller: FRPP,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.15, decel_profile_a: 1.5}
    - {type: drive, course: p_up, until: p_up_spot, controller: RRPP,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: p_up, until: p_up_end, controller: FRPP, handoff_m: 3.0}
  p_down_route:
    - {type: drive, course: p_down, until: p_down_spot, controller: RRPP,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: p_down, until: p_down_end, controller: FRPP, handoff_m: 3.0}

  # 마지막 차선. 여기서 끝나면 미션 종료입니다([15]가 main의 마지막 스텝입니다).
  end_left_route:
    - {type: drive, course: end_left, until: end_left_end, controller: FRPP,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  end_right_route:
    - {type: drive, course: end_right, until: end_right_end, controller: FRPP,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
