# HYPER 미션 (용인 트랙) -- mission_manager_node가 읽습니다.
#
# 이 파일이 미션 포맷의 기준 문서입니다. 필드 하나하나의 뜻과 튜닝 지침은 아래
# `steps:` 바로 위의 주석 블록에 있고, 다른 미션(mission_school.yaml 등)은 여기를
# 가리킵니다. 예전에는 mission_sim.yaml이 그 자리였는데, Gazebo 월드가 이 트랙과
# 같은 map 좌표를 쓰게 되면서 시뮬레이션 전용 미션이 없어졌습니다 -- 이제 시뮬과
# 실차가 이 파일 하나를 같이 씁니다.
#
# 구조는 두 부분으로 나뉩니다.
#   labels: "어디서"  -- 코스 위의 이벤트 지점 좌표 (map 프레임, 미터)
#   steps:  "무엇을"  -- 그 지점들을 순서대로 엮은 미션 시퀀스
#
# 이렇게 나눈 이유: 정지 시간을 5초에서 6초로 바꾸거나 주차 접근을 튜닝할 때마다
# 코스를 다시 녹화할 수는 없기 때문입니다. labels는 코스를 다시 녹화해도 물리적
# 위치가 그대로면 살아남습니다(웨이포인트 idx가 아니라 좌표로 저장하므로).
#
# 갈림길이 있으면 세 번째 부분이 붙습니다.
#   courses: "어느 코스"  -- 갈래마다 따로 녹화한 CSV와 그 CSV의 labels
#   routes:  "고르면 무엇을" -- branch가 고를 수 있는 스텝 시퀀스들
#
# labels 채우는 법:
#   ros2 run hyper_waypoint_studio waypoint_studio \
#       src/planning/hyper_waypoint/waypoints/track/common_1.csv \
#       --mission src/planning/hyper_planner/mission/mission_track.yaml --mode edit
#
# mission_manager는 로드 시점에 각 label을 CSV의 최근접 웨이포인트로 스냅하고,
# 스냅 거리가 label_snap_tolerance_m를 넘으면 미션을 거부합니다(라벨이 엉뚱한 데
# 붙은 채로 주행이 시작되는 사고 방지).
#
# 실행:
#   ros2 launch hyper_planner nav2_controller.launch.py
#   ros2 launch hyper_planner mission.launch.py mission:=mission_track controller_vx_max:=2.22
#   ros2 service call /mission_manager/start std_srvs/srv/Trigger
#
# controller_vx_max:=2.22는 반드시 넘겨야 합니다. 기본값 1.0은 MPPI의 vx_max에 맞춘
# 값인데, 이 미션에서 감속 프로파일이 붙은 스텝은 전부 RPP(desired_linear_vel 2.22)라
# 1.0으로 두면 /speed_limit이 포화해 제동이 늦게 걸립니다 -- 정지선을 넘습니다.
#
#
# 코스 구성
# ---------
# 트랙은 한 번에 녹화되지 않았습니다. 갈림길마다 따로 녹화한 조각들이고, 이음매는
# 전부 2 m 안입니다(측정값 -- 아래 숫자는 "앞 CSV의 끝 -> 뒤 CSV의 첫 점" 거리).
#
#   start_left  --0.65--> common_1 --0.50--> t_left  --0.54--> common_2 --0.41--> p_up   --0.57--> common_3 --1.04--> end_left
#   start_right --1.79--> common_1 --0.50--> t_right --0.61--> common_2 --0.70--> p_down --1.23--> common_3 --0.64--> end_right
#
#
# 주의: studio는 labels: 블록을 **통째로 재작성**합니다. 라벨 옆에 손으로 쓴 설명을
# 두면 저장 한 번에 사라지므로, 설명은 labels: 줄 *위*에 두세요(거기는 안 건드립니다).
#
#
# 컨트롤러
# --------
# 이 코스는 RPP(FRPP)가 기본이고, s자 구간에서만 MPPI로
# 바꿉니다. MPPI는 장애물을 만나면 비켜 가고 RPP는 경로를 지키다 포기하는데, 연속
# 회피가 필요한 곳은 s자뿐이기 때문입니다.
#
# 컨트롤러는 follow_path 골에 실려 나가므로 바꾸려면 새 골을 보내야 하고, 보통의 스텝
# 전환은 골 판정을 기다리므로 차가 라벨에서 한 번 섭니다. s자 앞뒤로 두 번 서지 않도록
# 그 자리에는 handoff_m을 씁니다 -- 골까지 그만큼 남으면 다음 스텝의 골로 갈아끼워
# (/cmd_vel이 끊기지 않습니다) 그대로 이어 갑니다. handoff_m은 decel_profile_a /
# cancel_on_arrival_m과 같이 쓸 수 없습니다(둘 다 "라벨에서 선다"는 뜻입니다).
#
# RPP는 스스로 라벨 앞에서 감속하지 않습니다. 그래서 서야 하는 스텝에는 반드시
# decel_profile_a + cancel_on_arrival_m이 같이 붙습니다. /speed_limit은 비율로 나가므로
# mission_manager의 controller_vx_max가 RPP의 desired_linear_vel(2.22)과 같아야 합니다.

label_snap_tolerance_m: 1.0

# 실제 최악 이음매는 end_left의 1.04 m입니다(common_3 끝 -> end_left 첫 점).
branch_seam_tolerance_m: 2.0

# 이 미션에는 main 코스가 없습니다 -- 트랙이 조각으로 녹화되어 있어 "이 미션이 달리는
# 코스" 하나를 고를 수 없기 때문입니다. 그래서 최상위 labels: 블록도 없고(그건 main의
# 것입니다), 라벨은 코스마다 courses.<이름>.labels에, CSV 경로는 코스마다 waypoints/
# 기준으로(track/common_1.csv) 적습니다. 모든 drive 스텝은 course:를 명시해야 합니다.
courses:
  # 1) 출발 갈래. 차를 어느 출발선에 놓았느냐로 정해집니다(start_branch).
  #    두 CSV 모두 정지선이 하나씩 있고, 끝에서 common_1으로 합류합니다.
  start_left:
    csv: track/start_left.csv
    # stopline_left: PLACEHOLDER -- 좌측 출발 정지선으로 옮길 것.
    # start_left_end가 last가 아닌 이유: 마지막 점(#121)의 yaw가 2.564로, 이웃
    # (#117~120: -0.886 -> -0.684)과 약 173도 어긋난 녹화 오류입니다. 골 포즈가 뒤집힌
    # 헤딩을 물고 가지 않도록 한 점 앞(#120)에서 끊습니다. CSV를 고치면 last로 되돌리세요.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      stopline_left: {x: 3.028, y: 27.858}   # wp #52
      start_left_end: {x: -28.716, y: 13.809}   # wp #120
      
  start_right:
    csv: track/start_right.csv
    # stopline_right: PLACEHOLDER -- 우측 출발 정지선으로 옮길 것.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      stopline_right: {x: 4.341, y: 30.910}   # wp #41
      start_right_end: {x: -29.300, y: 14.054}   # wp #121

  common_1:
    csv: track/common_1.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      light_1: {x: -0.846, y: 1.740}   # wp #68
      s_curve_start: {x: -23.101, y: -23.846}   # wp #138
      s_curve_end: {x: -43.334, y: -1.138}   # wp #185
      cone_2: {x: 5.037, y: -17.705}   # wp #264
      park_t_entry: {x: -2.297, y: -35.820}   # wp #289
      light_2: {x: -12.994, y: -6.010}   # wp #230, orphan: 어떤 step도 참조하지 않음

  # 2) T자 주차 갈래. 두 CSV 모두 common_1의 끝(park_t_entry)에서 *후진으로* 시작합니다
  #    -- 녹화가 그렇게 되어 있습니다(t_left #0~23, t_right #0~24가 후진 구간). 그래서
  #    갈래의 첫 스텝이 RRPP이고, 칸 안의 방향 전환점이 *_spot 라벨입니다.
  t_left:
    csv: track/t_left.csv
    # t_left_spot은 후진 끝(방향 전환점)입니다 -- wp #23.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      t_left_spot: {x: 9.130, y: -32.359}   # wp #23
      t_left_end: last
  t_right:
    csv: track/t_right.csv
    # t_right_spot은 후진 끝(방향 전환점)입니다 -- wp #24.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      t_right_spot: {x: 10.209, y: -30.443}   # wp #24
      t_right_end: last

  # 3) T자 주차 뒤의 공통 구간. 신호등 -> 가속 구간 -> 평행 주차 진입까지입니다.
  common_2:
    csv: track/common_2.csv
    # 정지선, 가속 구간 시작선, 가속 구간 종료선으로 옮길 것.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      light_3: {x: -5.245, y: -19.289}   # wp #98
      accel_start: {x: -53.250, y: -26.930}   # wp #227
      accel_end: {x: 2.155, y: -49.931}   # wp #300
      park_p_entry: last

  # 4) 평행 주차 갈래. 두 CSV의 모양이 다릅니다.
  #    p_up   : 전진 #0~8 -> 후진 #8~23 -> 전진 #23~41 (진입 스텝이 하나 더 있습니다)
  #    p_down : 후진 #0~9 -> 전진 #9~30 (첫 점부터 이미 후진입니다)
  p_up:
    csv: track/p_up.csv
    # p_up_entry(wp #8)에서 후진으로 바뀌고, p_up_spot(wp #23)이 칸 안 방향 전환점입니다.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      p_up_entry: {x: 12.908, y: -10.057}   # wp #8
      p_up_spot: {x: 20.226, y: -7.118}   # wp #23
      p_up_end: last
  p_down:
    csv: track/p_down.csv
    # p_down_spot은 칸 안 방향 전환점입니다 -- wp #9.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      p_down_spot: {x: 26.946, y: -9.690}   # wp #9
      p_down_end: last

  # 5) 주차 뒤 합류 구간과 마지막 차선 갈래.
  common_3:
    csv: track/common_3.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      common_3_end: last
  end_left:
    csv: track/end_left.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      end_left_end: last
  end_right:
    csv: track/end_right.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      end_right_end: last

# --- 미션 시퀀스 ---
#
# 갈래(routes)가 끝나면 그 branch 바로 뒤의 스텝으로 합류합니다. 그래서 아래 순서는
#   [분기] -> [합류해서 이어 갈 스텝] -> ... -> [다음 분기] -> ...
# 로 읽으면 됩니다. 실제 스텝 인덱스(~/goto_step에 쓰는 번호)는 routes가 뒤에 붙으므로
# yaml 순서와 다릅니다 -- `ros2 topic echo /mission_manager/steps --once`로 보세요.

# --- 미션 시퀀스 ---
#
# step 종류:
#   drive        경로를 따라 `until` 라벨까지 주행. 한 세그먼트 = follow_path 골 1개.
#                controller/goal_checker로 nav2 플러그인을 골라 쓸 수 있습니다
#                (nav2_controller.yaml에 등록된 이름: MPPI / RRPP,
#                 general_goal_checker / precise_goal_checker).
#                reverse: true 는 "이 구간은 후진으로 녹화했다"는 표시입니다.
#                포즈 방향은 CSV의 yaw(= 실제 차체 헤딩)를 그대로 쓰므로 뒤집지 않습니다
#                -- RPP는 진행 방향을 포즈 방향이 아니라 carrot 점의 차체 좌표계 x부호로
#                판단하고, goal checker의 yaw 비교는 차체 헤딩 기준이기 때문입니다.
#                이 플래그가 실제로 하는 일은 (1) 헤딩을 무시하는 직선 진입 경로(lead-in)를
#                끄고, (2) CSV에 yaw가 없을 때 유도한 방향을 180도 뒤집는 것입니다.
#                로드 시점에 녹화된 방향과 플래그가 맞는지 검사해 경고합니다.
#
#                cancel_on_arrival_m: 골까지 남은 거리가 이 값 이하이고 속도도 충분히
#                떨어졌으면, 골 판정을 기다리지 않고 취소해 도착으로 칩니다. MPPI는 골
#                공차 안으로 들어가는 마지막 수십 cm를 기어가는데(nav2_controller.yaml의
#                precise_goal_checker 주석), 어차피 뒤에 stop/wait_signal이 붙는
#                스텝이라면 그 시간을 버릴 이유가 없습니다. 그만큼 짧게 서므로 정지선
#                앞에서는 오히려 안전한 쪽입니다. 0 = 끔(기본값).
#
#                후진 주차 스텝(park_*_spot)에는 켜지 마세요 -- 0.4 m 짧게 서면 칸에 덜
#                들어갑니다. 반대로 주차 *진입* 스텝에는 반드시 켜야 합니다: 진입 스텝은
#                decel_profile_a를 쓰고, 프로파일을 쓰면 경로 끝이 라벨보다 뒤에 있어
#                goal checker가 라벨에서 절대 만족되지 않기 때문입니다(도착 판정이 오직
#                취소로만 일어납니다). 대신 값을 작게 잡으세요 -- 진입에서 덜 간 거리는
#                그대로 후진 경로 전체를 밀어, 칸 안 정지 오차에 더해집니다.
#
#                decel_profile_a: 0보다 크면 이 스텝을 등감속(m/s^2)으로 세웁니다. 0 = 끔.
#                MPPI는 가속도 제약이 없고, 감속이 "궤적의 마지막 점을 경로 끝점에 맞춘다"는
#                항에서 부수적으로 나옵니다. 그래서 속도가
#                    v = 남은거리 / (time_steps * model_dt)
#                라는 지수 감쇠가 되어 수학적으로 영영 도착하지 않고, local costmap 반지름
#                (10 m)부터 기어가기 시작해 정지까지 5초 넘게 씁니다.
#
#                이 값을 켜면 미션 매니저가 두 가지를 합니다.
#                 (1) 골 경로를 라벨보다 decel_profile_lookahead_m(기본 12 m)만큼 뒤까지
#                     늘립니다. MPPI가 보는 경로 끝이 costmap 밖에 있으면 위의 감속 항이
#                     아예 켜지지 않아, 차는 라벨 직전까지 vx_max로 달립니다. 이 꼬리는
#                     녹화 코스가 아니라 라벨의 진행 방향으로 뻗은 직선이라, 코스가 라벨
#                     뒤에서 무엇을 하든(후진/코스 끝) 항상 정확히 그 길이만큼 붙습니다.
#                 (2) 대신 /speed_limit으로 v = sqrt(2*a*d)를 실어 보내 vx_max를 직접
#                     깎습니다. 이게 등감속 프로파일입니다.
#
#                반드시 cancel_on_arrival_m과 같이 쓰세요. 경로 끝이 라벨보다 뒤에 있으므로
#                goal checker는 라벨에서 절대 만족되지 않고, 도착 판정이 오직 취소로만
#                일어납니다. 취소가 안 걸리면 차가 정지선을 그냥 지나갑니다(그때를 위한
#                하드 백스톱이 노드 안에 두 개 있고, 걸리면 ERROR/WARN 로그가 납니다).
#
#                a 값 정하기: 2.0이면 2.22 m/s에서 제동거리 1.23 m입니다(6 m/s 시절에는
#                9 m였습니다 -- vx_max를 내리면서 프로파일이 훨씬 짧아졌습니다). 차가 실제로 그만큼 못
#                줄이면 프로파일보다 빠르게 라벨에 닿아 "reached ... above
#                cancel_on_arrival_speed" 경고가 납니다 -- 그러면 a를 낮추세요. 반대로
#                여유 있게 서면 올려서 시간을 줄이세요.
#
#                후진 스텝에는 켤 수 없습니다(로드 시점에 자동으로 꺼집니다) -- RPP는
#                goal checker에 실제로 닿아야 하기 때문입니다. 주차 *진입* 스텝에는
#                켜세요: 안 켜면 MPPI의 지수 감속으로 마지막 10 m를 기어들어가고, 차가
#                제대로 서기 전에 goal checker가 먼저 만족돼 후진 스텝이 시작됩니다.
#                늘리는 꼬리가 녹화 코스가 아니라 직선이라, 라벨 뒤가 후진 구간이어도
#                (주차 진입) 켤 수 있습니다.
#
#                obstacle_hold_s: 0보다 크면, 이 스텝에서 컨트롤러가 abort 했을 때 미션을
#                실패로 끝내지 않고 "앞이 막혔다"로 봅니다. 골을 안 보낸 채로 서 있다가
#                (워치독이 차를 세웁니다) obstacle_retry_period_sec(기본 1초)마다 같은 골을
#                다시 보내고, 치워지면 선 자리에서 그대로 이어 갑니다. 이 시간(초) 동안 계속
#                막혀 있으면 그때는 실패로 끝냅니다(영영 서 있는 것보다 낫습니다).
#                0 = 끔 -- 그때는 goal_retry_limit(기본 2)이 소진되는 즉시 미션 실패입니다.
#
#                경로를 벗어나지 않는 컨트롤러(FRPP / RRPP)에서만
#                의미가 있습니다. MPPI는 애초에 막히면 비켜 가므로 abort 자체가
#                거의 안 납니다.
#   stop         duration_s 동안 정지. 골을 안 보내면 cmd_vel_to_ackermann의
#                워치독(input_timeout 0.3s)이 차를 세웁니다.
#   wait_signal  /perception/sign이 value를 debounce_frames 연속으로 낼 때까지 대기.
#                value에 쉼표를 넣어 여러 신호를 허용할 수 있습니다(예: "green,left_arrow").
#                timeout_s 안에 못 보면 기본값(proceed_on_signal_timeout: true)으로는
#                경고를 남기고 그냥 출발합니다 -- 대회에서 영영 멈춰 서는 것보다 낫습니다.
#
#                prearm_distance_m: 0보다 크면, 앞 drive 스텝의 골까지 이만큼 남았을 때부터
#                신호를 미리 봅니다. 통과 신호가 확인되면 서지 않고 그대로 통과합니다 --
#                실행 중인 골을 "지금 위치 -> 다음 drive 스텝의 끝"까지의 골로 갈아끼우고
#                (nav2가 /cmd_vel을 끊지 않고 갈아끼웁니다) 이 wait_signal을 건너뜁니다.
#                초록불에 굳이 정차했다 재출발하는 시간을 없애는 것이 목적입니다.
#
#                확인이 안 되면 -- 빨간불이든, 인식이 끊겼든, 애매하든 -- 아무 일도 일어나지
#                않고 원래 골 그대로 정지선에 섭니다. 즉 기본 동작이 "정지"이고 "통과"가
#                명시적 예외라, 인식이 흔들려도 안전한 쪽으로 실패합니다.
#
#                패턴이 [drive -> wait_signal -> drive]가 아니면(뒤가 stop이거나, 뒤 drive가
#                후진 세그먼트이거나, 두 drive의 controller가 다르면) 로드 시점에 경고를
#                남기고 이 자리의 prearm만 끕니다 -- 그러면 예전처럼 서서 기다립니다.
#
#                값을 정할 때: 클수록 초록불을 일찍 잡아 감속을 덜 하지만, 그만큼 멀리서
#                신호등을 분류해야 합니다(화면에서 몇 픽셀 안 됩니다). 정지선을 넘을
#                위험은 늘지 않습니다 -- 서는 쪽은 원래 골이 그대로 하기 때문입니다.
#
#                대신 늘어나는 위험이 하나 있습니다: 갈아끼우기는 되돌릴 수 없습니다.
#                통과 판정이 나면 그 자리에서 wait_signal을 건너뛰므로 신호를 더 이상 보지
#                않고, 통과한 뒤 신호가 초록 -> 빨강으로 바뀌어도 그대로 지나갑니다.
#                15 m / 2.22 m/s면 약 6.8초의 노출입니다(6 m/s 시절에는 2.5초였습니다).
#                이 값을 키운다는 것은 그 창을 넓힌다는 뜻이므로, 신호 주기를 생각하며
#                정하세요. vx_max를 2.5로 내리면서 같은 거리가 2.4배 긴 시간이 됐으므로,
#                신호 주기가 짧다면 prearm_distance_m를 6~8 m로 줄이는 것을 검토하세요.
#
#   branch       차선 안내 신호를 보고 두 갈래(routes) 중 하나를 골라 그리로 갑니다.
#                코스 끝의 갈림길처럼 "표지가 알려 주는 대로 가야 하는" 곳에 씁니다.
#
#                wait_signal과 결정적으로 다른 점은 "못 봤다"의 안전한 답이 없다는 것입니다.
#                신호등은 못 보면 서 있으면 되지만 갈림길에서는 어디로든 가야 합니다.
#                그래서 `default`가 필수이고, timeout_s는 신호등의 120초와 달리 짧게 잡습니다
#                (더 기다린다고 더 나은 답이 나오지 않습니다). 못 고르고 timeout이 지나면
#                경고를 남기고 default 갈래로 갑니다.
#
#                판정은 "vote_window_s(기본 3초) 동안 모은 표의 다수결"입니다. wait_signal의
#                "허용 목록 안이기만 하면 됨"과 다른데, 분기는 *어느 값이* 나왔는지가 곧 어느
#                길이기 때문입니다. 연속 프레임을 안 쓰는 이유는 갈림길 표지판 세 장이 나란히
#                깜빡여서 연속이 계속 끊기기 때문입니다. 어느 case에도 없는 값(none 등)은 세기만
#                하고 이길 수 없고, 표가 없거나 두 갈래가 동점이면 고르지 않은 채 timeout까지
#                계속 모읍니다 -- 애매할 때 찍지 않는 쪽이 맞습니다. 고른 순간과 timeout 순간에
#                표 현황이 로그로 나갑니다("allow_left 14, allow_right 3, none 6").
#                vote_window_s는 timeout_s보다 작아야 합니다(아니면 로드가 거부됩니다 --
#                창이 차기 전에 무조건 default로 가는 설정이기 때문입니다).
#
#                prearm_distance_m: wait_signal과 같습니다. 0보다 크면 앞 drive 스텝의 골까지
#                이만큼 남았을 때부터 표지를 미리 보고, 확인되면 서지 않고 그대로 갈래로
#                들어갑니다(골을 "지금 위치 -> 분기 지점 -> 고른 갈래의 끝"으로 갈아끼웁니다).
#                확인이 안 되면 원래 골 그대로 분기 지점에 서고, 거기서 branch가 다시 봅니다.
#
#                cases의 value에 쉼표를 넣어 한 갈래에 여러 값을 허용할 수 있습니다.
#                같은 값이 두 갈래에 나오면 로드 시점에 거부합니다(어디로 갈지가 순서에
#                숨는 것을 막습니다).
#
#                갈래(routes)가 끝나면 branch 뒤의 main 스텝으로 합류하고, branch가 main의
#                마지막 스텝이면 미션이 끝납니다. route 안에 또 branch를 두는 것은 지원하지
#                않습니다(합류 지점이 모호해집니다).
#
# 장애물 회피는 step이 아닙니다 -- 이미 MPPI costmap 안에서 처리되므로
# 해당 구간 drive step 안에서 자동으로 일어납니다.
steps:
  # [0] 출발 갈래. 표지가 아니라 차의 현재 위치로 고릅니다: start_left.csv의 첫 점과
  # start_right.csv의 첫 점 중 가까운 쪽입니다(두 출발선은 약 3 m 떨어져 있습니다).
  # cases를 남겨 둔 이유는 /perception/sign으로 손수 밀어 넣어 갈래를 강제할 수 있게
  # 하기 위해서입니다(위치 판정이 이기므로 평소에는 쓰이지 않습니다).
  # tf를 못 읽으면 timeout 뒤 default로 갑니다.
  - type: branch
    select_by: position
    default: start_right_route
    timeout_s: 5.0
    # debounce_frames도 vote_window_s도 적지 않습니다 -- 위치로 고르는 분기는 신호를
    # 아예 안 보므로 둘 다 쓰이지 않습니다.
    prearm_distance_m: 0.0      # 앞에 drive 스텝이 없습니다. 미리 볼 것도 없습니다.
    cases:
      - {value: "start_left",  goto: start_left_route}
      - {value: "start_right", goto: start_right_route}

  # [1~2] 합류 뒤 첫 신호등.
  - {type: drive, course: common_1, until: light_1, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  - {type: wait_signal, value: green, timeout_s: 120.0, debounce_frames: 3,
     prearm_distance_m: 12.0}

  # [3~5] s자 구간. 여기만 MPPI입니다 -- 연속 회피가 필요한 유일한 곳입니다.
  # 앞뒤 경계에서 서지 않도록 handoff_m으로 골을 갈아끼웁니다(컨트롤러 전환).
  # 이 세 스텝에 decel_profile_a / cancel_on_arrival_m이 없는 것은 실수가 아닙니다:
  # 둘 다 "라벨에서 선다"는 뜻이라 handoff와 같이 쓸 수 없습니다.
  - {type: drive, course: common_1, until: s_curve_start, controller: FRPP, handoff_m: 6.0}
  - {type: drive, course: common_1, until: s_curve_end, controller: MPPI, handoff_m: 6.0}
  # cone_2는 T주차 안내 표지를 읽는 지점입니다(판정은 아직 미구현 -- 아래 [7] 참고).
  # 라벨만 두고 그대로 통과합니다 -- ~/goto_step으로 이 구간부터 다시 달릴 때 씁니다.
  - {type: drive, course: common_1, until: cone_2, controller: FRPP, handoff_m: 6.0}

  # [6] T자 주차 갈림길까지. common_1은 여기서 끝납니다(park_t_entry = last).
  - {type: drive, course: common_1, until: park_t_entry, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}

  # [7] T자 주차 갈래.
  # !! 판정 조건이 아직 없습니다. 지금은 표지값을 그냥 기다리다 timeout 뒤 default로
  #    갑니다. 조건이 정해지면 cases의 value를 실제 표지값으로 바꾸거나(그러면 여기가
  #    그대로 동작합니다), 위치로 정해지는 것이면 [0]처럼 select_by: position을 쓰세요.
  #    timeout을 3초로 짧게 둔 것은 어차피 답이 안 나오기 때문입니다.
  # prearm_distance_m가 0인 것도 의도된 것입니다 -- 두 갈래 모두 후진으로 시작하므로
  # 골을 하나로 합칠 수 없어(방향 전환) 어차피 prearm이 꺼집니다.
  - type: branch
    default: t_right_route
    timeout_s: 3.0
    # timeout_s가 3초로 짧으므로 창도 짧게 잡습니다(창은 timeout_s보다 작아야 합니다).
    # 이 값들은 표지로 나오지 않고 운영자가 손으로 밀어 넣는 용도라, 10 Hz면 1초에
    # 열 표쯤 모여 충분합니다.
    vote_window_s: 1.0
    prearm_distance_m: 0.0
    cases:
      - {value: "t_left",  goto: t_left_route}
      - {value: "t_right", goto: t_right_route}

  # [8~9] 합류(common_2) 뒤 두 번째 신호등.
  - {type: drive, course: common_2, until: light_3, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  - {type: wait_signal, value: green, timeout_s: 120.0, debounce_frames: 3,
     prearm_distance_m: 12.0}

  # [10~11] 가속 구간. 여기는 원래부터 RPP여야 하는 곳입니다 -- 장애물 앞에서 비켜 가지
  # 않고 반드시 서야 합니다. obstacle_hold_s가 그 정지를 미션 실패가 아니라 대기로
  # 다룹니다(1초마다 같은 골을 다시 보내고, 30초 넘게 막혀 있으면 그때 실패).
  - {type: drive, course: common_2, until: accel_start, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  - {type: drive, course: common_2, until: accel_end, controller: FRPP,
     goal_checker: precise_goal_checker, obstacle_hold_s: 30.0,
     cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}

  # [12] 평행 주차 갈림길까지. common_2는 여기서 끝납니다(park_p_entry = last).
  - {type: drive, course: common_2, until: park_p_entry, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}

  # [13] 평행 주차 갈래. [7]과 같이 판정 조건이 아직 없습니다.
  - type: branch
    default: p_down_route
    timeout_s: 3.0
    vote_window_s: 1.0          # 위 T자 주차와 같은 이유로 짧게.
    prearm_distance_m: 0.0
    cases:
      - {value: "p_up",   goto: p_up_route}
      - {value: "p_down", goto: p_down_route}

  # [14] 합류(common_3) -- 마지막 차선 갈림길까지.
  - {type: drive, course: common_3, until: common_3_end, controller: FRPP,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}

  # [15] 마지막 차선 갈래. 나란히 선 표지판 세 장 중 **왼쪽 두 장**을 object_detection이
  # 읽어 allow_left / allow_right로 냅니다(publish_lane_fork_sign). 표지판은 깜빡이지만
  # 한 칸이 꺼져 있어도(blank) 나머지 한 칸이 allow/ban이면 답이 정해지고, 판단은 아래
  # vote_window_s 동안 모은 표의 다수결이라 깜빡임에 끊기지 않습니다. 여기는 두 갈래 모두
  # 전진이고 컨트롤러도 앞 스텝과 같으므로 prearm이 걸립니다 -- 서지 않고 그대로
  # 갈래로 들어갑니다.
  - type: branch
    default: end_right_route
    timeout_s: 8.0
    vote_window_s: 3.0          # 이 시간 동안 모아 다수결. timeout_s보다 작아야 합니다.
    prearm_distance_m: 12.0
    cases:
      - {value: "allow_left",  goto: end_left_route}
      - {value: "allow_right", goto: end_right_route}

routes:
  # 출발 갈래: 정지선에서 5초 정차한 뒤 코스 끝까지. 끝나면 [1]로 합류합니다.
  start_left_route:
    - {type: drive, course: start_left, until: stopline_left, controller: FRPP,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
    - {type: stop, duration_s: 5.0}
    - {type: drive, course: start_left, until: start_left_end, controller: FRPP}
  start_right_route:
    - {type: drive, course: start_right, until: stopline_right, controller: FRPP,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
    - {type: stop, duration_s: 5.0}
    - {type: drive, course: start_right, until: start_right_end, controller: FRPP}

  # T자 주차: 분기 지점에서 곧바로 후진 입고 -> 정차 -> 전진 출차. 출차가 별도 갈래
  # 스텝인 이유는 RPP가 한 경로 안의 방향 전환을 처리하지 못하기 때문입니다.
  # 후진 스텝에는 cancel_on_arrival_m을 켜지 마세요 -- 짧게 서면 칸에 덜 들어갑니다.
  t_left_route:
    - {type: drive, course: t_left, until: t_left_spot, controller: RRPP,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: t_left, until: t_left_end, controller: FRPP}
  t_right_route:
    - {type: drive, course: t_right, until: t_right_spot, controller: RRPP,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: t_right, until: t_right_end, controller: FRPP}

  # 평행 주차. p_up만 진입 스텝이 하나 더 있습니다(녹화가 전진 -> 후진 -> 전진).
  # 진입 스텝의 cancel_on_arrival_m는 정지선(0.4)보다 작게 잡습니다: 진입에서 덜 간
  # 거리가 그대로 칸 안 정지 오차에 더해집니다.
  p_up_route:
    - {type: drive, course: p_up, until: p_up_entry, controller: FRPP,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.15, decel_profile_a: 1.5}
    - {type: drive, course: p_up, until: p_up_spot, controller: RRPP,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: p_up, until: p_up_end, controller: FRPP}
  p_down_route:
    - {type: drive, course: p_down, until: p_down_spot, controller: RRPP,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: p_down, until: p_down_end, controller: FRPP}

  # 마지막 차선. 여기서 끝나면 미션 종료입니다([15]가 main의 마지막 스텝입니다).
  end_left_route:
    - {type: drive, course: end_left, until: end_left_end, controller: FRPP,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  end_right_route:
