# HYPER 실차 미션 (교내 코스) -- mission_manager_node가 읽습니다.
#
# 필드 하나하나의 뜻과 튜닝 지침은 mission/mission_track.yaml의 주석이 원본입니다.
# 여기서는 이 코스에만 해당하는 것 -- 코스가 어떻게 이어지는지, 어느 라벨이 아직
# 가짜인지, 왜 컨트롤러가 구간마다 다른지 -- 만 적습니다.
#
# 이 미션은 datum_site:=school로 띄워야 합니다(기본값은 track입니다). Gazebo 월드는
# 용인 트랙의 트윈이라 이 코스는 시뮬에 대응하는 지형이 없습니다 -- 실차 전용입니다.
#
# 실행:
#   ros2 launch hyper_planner nav2_controller.launch.py
#   ros2 launch hyper_planner mission.launch.py mission:=mission_school controller_vx_max:=2.22
#   ros2 service call /mission_manager/start std_srvs/srv/Trigger
#
# controller_vx_max:=2.22는 반드시 넘겨야 합니다. 기본값 1.0은 MPPI의 vx_max에 맞춘
# 값인데, 이 미션에서 감속 프로파일이 붙은 스텝은 전부 RPP(desired_linear_vel 2.22)라
# 1.0으로 두면 /speed_limit이 포화해 제동이 늦게 걸립니다 -- 정지선을 넘습니다.
#
#
# 코스 구성
# ---------
# 코스는 한 번에 녹화되지 않았습니다. 갈림길마다 따로 녹화한 조각들이고, 이음매는
# 전부 0.5 m 안입니다(측정값 -- 아래 숫자는 "앞 CSV의 끝 -> 뒤 CSV의 첫 점" 거리).
#
#   start_left  --0.42--> common_1 --0.05--> t_left  --0.29--> common_2 --0.34--> p_up   --0.43--> common_3 --0.25--> end_left
#   start_right --0.43--> common_1 --0.05--> t_right --0.21--> common_2 --0.03--> p_down --0.23--> common_3 --0.25--> end_right
#
#
# 주의: studio는 labels: 블록을 **통째로 재작성**합니다. 라벨 옆에 손으로 쓴 설명을
# 두면 저장 한 번에 사라지므로, 설명은 labels: 줄 *위*에 두세요(거기는 안 건드립니다).
#
#
# 컨트롤러
# --------
# 이 코스는 RPP(ForwardFollowPath)가 기본이고, s자 구간에서만 MPPI로
# 바꿉니다. MPPI는 장애물을 만나면 비켜 가고 RPP는 경로를 지키다 포기하는데, 연속
# 회피가 필요한 곳은 s자뿐이기 때문입니다.
#
# 컨트롤러는 follow_path 골에 실려 나가므로 바꾸려면 새 골을 보내야 하고, 보통의 스텝
# 전환은 골 판정을 기다리므로 차가 라벨에서 한 번 섭니다. s자 앞뒤로 두 번 서지 않도록
# 그 자리에는 handoff_m을 씁니다 -- 골까지 그만큼 남으면 다음 스텝의 골로 갈아끼워
# (/cmd_vel이 끊기지 않습니다) 그대로 이어 갑니다. handoff_m은 decel_profile_a /
# cancel_on_arrival_m과 같이 쓸 수 없습니다(둘 다 "라벨에서 선다"는 뜻입니다).
#
# RPP는 스스로 라벨 앞에서 감속하지 않습니다. 그래서 서야 하는 스텝에는 반드시
# decel_profile_a + cancel_on_arrival_m이 같이 붙습니다. /speed_limit은 비율로 나가므로
# mission_manager의 controller_vx_max가 RPP의 desired_linear_vel(2.22)과 같아야 합니다.

label_snap_tolerance_m: 1.0

# 실제 최악 이음매는 start_right의 0.43 m입니다(start_right 끝 -> common_1 첫 점).
branch_seam_tolerance_m: 2.0

# 이 미션에는 main 코스가 없습니다 -- 트랙이 조각으로 녹화되어 있어 "이 미션이 달리는
# 코스" 하나를 고를 수 없기 때문입니다. 그래서 최상위 labels: 블록도 없고(그건 main의
# 것입니다), 라벨은 코스마다 courses.<이름>.labels에, CSV 경로는 코스마다 waypoints/
# 기준으로(track/common_1.csv) 적습니다. 모든 drive 스텝은 course:를 명시해야 합니다.
courses:
  # 1) 출발 갈래. 차를 어느 출발선에 놓았느냐로 정해집니다(start_branch).
  #    두 CSV 모두 정지선이 하나씩 있고, 끝에서 common_1으로 합류합니다.
  start_left:
    csv: school/start_left.csv
    # stopline_left: PLACEHOLDER -- 좌측 출발 정지선으로 옮길 것.
    # start_left_end는 이 CSV의 마지막 점(#71)입니다 -- 좌표로 적혀 있을 뿐 last와 같습니다.
    # (예전에 마지막 점 yaw가 이웃과 173도 어긋나 한 점 앞에서 끊었다는 주석이 있었는데,
    #  그건 122점짜리 track/start_left.csv 이야기였고 school 녹화본에는 해당되지 않습니다.)
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      stopline_left: {x: -20.167, y: 27.818}   # wp #24
      start_left_end: {x: -33.151, y: 20.622}   # wp #71
      
  start_right:
    csv: school/start_right.csv
    # stopline_right: PLACEHOLDER -- 우측 출발 정지선으로 옮길 것.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      stopline_right: {x: -19.384, y: 29.995}   # wp #25
      start_right_end: {x: -33.175, y: 20.602}   # wp #92

  common_1:
    csv: school/common_1.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      light_1: {x: -32.392, y: 20.260}   # wp #1
      s_curve_start: {x: -30.098, y: 20.953}   # wp #6
      s_curve_end: {x: -17.012, y: 21.649}   # wp #51
      cone_2: {x: -8.365, y: 18.860}   # wp #75
      light_2: {x: -13.606, y: 20.717}   # wp #60
      park_t_entry: {x: -0.906, y: 16.303}   # wp #99

  # 2) T자 주차 갈래. 두 CSV 모두 common_1의 끝(park_t_entry)에서 *후진으로* 시작합니다
  #    -- 녹화가 그렇게 되어 있습니다(t_left #0~23, t_right #0~24가 후진 구간). 그래서
  #    갈래의 첫 스텝이 ReverseFollowPath이고, 칸 안의 방향 전환점이 *_spot 라벨입니다.
  t_left:
    csv: school/t_left.csv
    # t_left_spot은 후진 끝(방향 전환점)입니다 -- wp #23.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      t_left_spot: {x: -2.415, y: 22.582}   # wp #23
      t_left_end: last
  t_right:
    csv: school/t_right.csv
    # t_right_spot은 후진 끝(방향 전환점)입니다 -- wp #24.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      t_right_spot: {x: -4.670, y: 23.348}   # wp #35
      t_right_end: last

  # 3) T자 주차 뒤의 공통 구간. 신호등 -> 가속 구간 -> 평행 주차 진입까지입니다.
  common_2:
    csv: school/common_2.csv
    # 정지선, 가속 구간 시작선, 가속 구간 종료선으로 옮길 것.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      light_3: {x: -11.594, y: 20.044}   # wp #10
      accel_start: {x: -13.377, y: 20.603}   # wp #17
      accel_end: {x: -17.356, y: 22.002}   # wp #34
      park_p_entry: {x: -19.748, y: 22.968}   # wp #42

  # 4) 평행 주차 갈래. 두 CSV의 모양이 다릅니다.
  #    p_up   : 전진 #0~8 -> 후진 #8~23 -> 전진 #23~41 (진입 스텝이 하나 더 있습니다)
  #    p_down : 후진 #0~9 -> 전진 #9~30 (첫 점부터 이미 후진입니다)
  p_up:
    csv: school/p_up.csv
    # p_up_entry(wp #8)에서 후진으로 바뀌고, p_up_spot(wp #23)이 칸 안 방향 전환점입니다.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      p_up_entry: {x: -24.428, y: 24.796}   # wp #21
      p_up_spot: {x: -18.284, y: 24.860}   # wp #51
      p_up_end: last
  p_down:
    csv: school/p_down.csv
    # p_down_spot은 칸 안 방향 전환점입니다 -- wp #9.
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      p_down_spot: {x: -13.588, y: 23.435}   # wp #27
      p_down_end: last

  # 5) 주차 뒤 합류 구간과 마지막 차선 갈래.
  common_3:
    csv: school/common_3.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      common_3_end: last
  end_left:
    csv: school/end_left.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      end_left_end: last
  end_right:
    csv: school/end_right.csv
    labels:
      # 이 블록은 waypoint studio가 통째로 재작성합니다. 손으로 쓴 주석을 여기 두지 마세요.
      end_right_end: last

# --- 미션 시퀀스 ---
#
# 갈래(routes)가 끝나면 그 branch 바로 뒤의 스텝으로 합류합니다. 그래서 아래 순서는
#   [분기] -> [합류해서 이어 갈 스텝] -> ... -> [다음 분기] -> ...
# 로 읽으면 됩니다. 실제 스텝 인덱스(~/goto_step에 쓰는 번호)는 routes가 뒤에 붙으므로
# yaml 순서와 다릅니다 -- `ros2 topic echo /mission_manager/steps --once`로 보세요.
steps:
  # [0] 출발 갈래. 표지가 아니라 차의 현재 위치로 고릅니다: start_left.csv의 첫 점과
  # start_right.csv의 첫 점 중 가까운 쪽입니다(두 출발선은 약 3 m 떨어져 있습니다).
  # cases를 남겨 둔 이유는 /perception/sign으로 손수 밀어 넣어 갈래를 강제할 수 있게
  # 하기 위해서입니다(위치 판정이 이기므로 평소에는 쓰이지 않습니다).
  # tf를 못 읽으면 timeout 뒤 default로 갑니다.
  - type: branch
    select_by: position
    default: start_right_route
    timeout_s: 5.0
    # debounce_frames도 vote_window_s도 적지 않습니다 -- 위치로 고르는 분기는 신호를
    # 아예 안 보므로 둘 다 쓰이지 않습니다.
    prearm_distance_m: 0.0      # 앞에 drive 스텝이 없습니다. 미리 볼 것도 없습니다.
    cases:
      - {value: "start_left",  goto: start_left_route}
      - {value: "start_right", goto: start_right_route}

  # [1~2] 합류 뒤 첫 신호등.
  - {type: drive, course: common_1, until: light_1, controller: ForwardFollowPath,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  - {type: wait_signal, value: green, timeout_s: 120.0, debounce_frames: 3,
     prearm_distance_m: 12.0}
  # [3~5] s자 구간. 여기만 MPPI입니다 -- 연속 회피가 필요한 유일한 곳입니다.
  # 앞뒤 경계에서 서지 않도록 handoff_m으로 골을 갈아끼웁니다(컨트롤러 전환).
  # 이 세 스텝에 decel_profile_a / cancel_on_arrival_m이 없는 것은 실수가 아닙니다:
  # 둘 다 "라벨에서 선다"는 뜻이라 handoff와 같이 쓸 수 없습니다.
  - {type: drive, course: common_1, until: s_curve_start, controller: ForwardFollowPath, handoff_m: 6.0}
  - {type: drive, course: common_1, until: s_curve_end, controller: MPPI, handoff_m: 6.0}

  - {type: drive, course: common_1, until: light_2, controller: ForwardFollowPath,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  - {type: wait_signal, value: green, timeout_s: 120.0, debounce_frames: 3,
     prearm_distance_m: 12.0}
  # cone_2는 T주차 안내 표지를 읽는 지점입니다(판정은 아직 미구현 - - 아래 [7] 참고).
  # 라벨만 두고 그대로 통과합니다 -- ~/goto_step으로 이 구간부터 다시 달릴 때 씁니다.
  - {type: drive, course: common_1, until: cone_2, controller: ForwardFollowPath, handoff_m: 6.0}
  # [6] T자 주차 갈림길까지. common_1은 여기서 끝납니다(park_t_entry = last).
  - {type: drive, course: common_1, until: park_t_entry, controller: ForwardFollowPath,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}

  # [7] T자 주차 갈래. 두 칸 중 하나의 입구에 콘이 서 있고, 비어 있는 칸으로 들어갑니다.
  #
  # !! cone 좌표가 아직 PLACEHOLDER입니다. 트랙에서 콘을 놓을 자리를 재서 채우세요 --
  #    waypoint studio로 그 자리에 커서를 두고 좌표를 읽거나, 차를 분기 지점에 세운 뒤
  #    ros2 param set /mission_manager probe_points "[x1, y1, x2, y2]" +
  #    ros2 service call /mission_manager/probe_costmap std_srvs/srv/Trigger 로
  #    "정말 여기에 셀이 잡히는가"를 확인하는 쪽이 확실합니다.
  #    콘 좌표가 없으면 미션이 로드 자체를 거부합니다(좌표 없는 갈래는 늘 비어 보이므로).
  #
  # 판정: 갈래마다 cone 자리 반지름(cone_radius_m, 기본 0.5 m) 안의 lethal 셀을 세고,
  # **정확히 한 갈래만** 비어 있으면 그리로 갑니다. 둘 다 비었거나 둘 다 막혔으면 아무
  # 것도 고르지 않고 timeout 뒤 default로 갑니다 -- 애매할 때 찍지 않는 쪽입니다.
  #
  # cases의 value는 그대로 둡니다. 콘 판정이 우선이지만, /perception/sign으로 값을 밀어
  # 넣어 갈래를 손수 강제할 통로가 남습니다([0]의 select_by: position과 같은 이유).
  #
  # prearm_distance_m가 0인 것도 의도된 것입니다 -- 두 갈래 모두 후진으로 시작하므로
  # 골을 하나로 합칠 수 없어(방향 전환) 어차피 prearm이 꺼집니다. 콘 판정 자체도 분기
  # 지점에 서야 의미가 있어(멀리서는 창 밖이거나 라이다에 안 잡힙니다) prearm을 안 씁니다.
  - type: branch
    select_by: clearance
    default: t_right_route
    # 3.0 -> 6.0. 코스트맵이 2 Hz라 3초면 여섯 장뿐이고, 그중 앞 몇 장은 차가 막 선
    # 직후라 콘이 덜 쌓여 있습니다.
    timeout_s: 6.0
    # 콘을 관측해 모으는 창. 표지 분기의 투표 창과 같은 필드를 씁니다(timeout_s보다
    # 작아야 합니다). 2 Hz x 2초 = 네 장이고, 갈래별로 그중 **최대** 셀 수를 씁니다 --
    # 한 장에서 못 본 콘이 다음 장에서 보이는 일이 있기 때문입니다.
    vote_window_s: 2.0
    prearm_distance_m: 0.0
    cases:
      - {value: "t_left",  goto: t_left_route,  cone: {x: -3, y: 21.02}}   # PLACEHOLDER
      - {value: "t_right", goto: t_right_route, cone: {x: -5, y: 22.05}}   # PLACEHOLDER

  # [8~9] 합류(common_2) 뒤 두 번째 신호등
  # [10~11] 가속 구간. 여기는 원래부터 RPP여야 하는 곳입니다 -- 장애물 앞에서 비켜 가지
  # 않고 반드시 서야 합니다. obstacle_hold_s가 그 정지를 미션 실패가 아니라 대기로
  # 다룹니다(1초마다 같은 골을 다시 보내고, 30초 넘게 막혀 있으면 그때 실패).
  - {type: drive, course: common_2, until: light_3, controller: ForwardFollowPath,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  - {type: wait_signal, value: green, timeout_s: 120.0, debounce_frames: 3,
     prearm_distance_m: 12.0}
  - {type: drive, course: common_2, until: accel_start, controller: ForwardFollowPath,
     goal_checker: precise_goal_checker, handoff_m: 6.0}
  - {type: drive, course: common_2, until: accel_end, controller: ForwardFollowPath,
     goal_checker: precise_goal_checker, obstacle_hold_s: 30.0,
     handoff_m: 6.0}

  # [12] 평행 주차 갈림길까지. common_2는 여기서 끝납니다(park_p_entry = last).
  - {type: drive, course: common_2, until: park_p_entry, controller: ForwardFollowPath,
     goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}

  # [13] 평행 주차 갈래. [7]과 같이 콘이 막지 않은 칸으로 들어갑니다 -- 규칙도 주의할
  # 점도 [7]의 주석과 같습니다. cone 좌표는 여기도 PLACEHOLDER입니다.
  #
  # 다만 이쪽은 두 칸이 코스트맵 x 방향으로 6 m쯤 떨어져 있습니다(p_up_spot과
  # p_down_spot의 거리). 분기 지점에서 먼 쪽 콘이 20 x 20 m 창 안에는 들어오지만,
  # 반지름이 창 경계에 걸리면 노드가 WARN을 냅니다 -- 그 줄이 보이면 콘이 잘려서
  # "비어 보이는" 것이므로 그대로 믿으면 안 됩니다.
  - type: branch
    select_by: clearance
    default: p_down_route
    timeout_s: 6.0
    vote_window_s: 2.0
    prearm_distance_m: 0.0
    cases:
      - {value: "p_up",   goto: p_up_route,   cone: {x: -15.24, y: 23.03}}   # PLACEHOLDER
      - {value: "p_down", goto: p_down_route, cone: {x: -20, y: 24.46}}   # PLACEHOLDER

  # [14] 합류(common_3) -- 마지막 차선 갈림길까지.
  - {type: drive, course: common_3, until: common_3_end, controller: ForwardFollowPath,
     goal_checker: precise_goal_checker, handoff_m: 6.0}

  # [15] 마지막 차선 갈래. 나란히 선 표지판 세 장 중 **왼쪽 두 장**을 object_detection이
  # 읽어 allow_left / allow_right로 냅니다(publish_lane_fork_sign). 표지판은 깜빡이지만
  # 한 칸이 꺼져 있어도(blank) 나머지 한 칸이 allow/ban이면 답이 정해지고, 판단은 아래
  # vote_window_s 동안 모은 표의 다수결이라 깜빡임에 끊기지 않습니다. 여기는 두 갈래 모두
  # 전진이고 컨트롤러도 앞 스텝과 같으므로 prearm이 걸립니다 -- 서지 않고 그대로
  # 갈래로 들어갑니다.
  - type: branch
    default: end_right_route
    timeout_s: 8.0
    vote_window_s: 3.0          # 이 시간 동안 모아 다수결. timeout_s보다 작아야 합니다.
    prearm_distance_m: 12.0
    cases:
      - {value: "allow_left",  goto: end_left_route}
      - {value: "allow_right", goto: end_right_route}

routes:
  # 출발 갈래: 정지선에서 5초 정차한 뒤 코스 끝까지. 끝나면 [1]로 합류합니다.
  start_left_route:
    - {type: drive, course: start_left, until: stopline_left, controller: ForwardFollowPath,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
    - {type: stop, duration_s: 5.0}
    - {type: drive, course: start_left, until: start_left_end, controller: ForwardFollowPath, handoff_m: 6.0}
  start_right_route:
    - {type: drive, course: start_right, until: stopline_right, controller: ForwardFollowPath,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
    - {type: stop, duration_s: 5.0}
    - {type: drive, course: start_right, until: start_right_end, controller: ForwardFollowPath, handoff_m: 6.0}

  # T자 주차: 분기 지점에서 곧바로 후진 입고 -> 정차 -> 전진 출차. 출차가 별도 갈래
  # 스텝인 이유는 RPP가 한 경로 안의 방향 전환을 처리하지 못하기 때문입니다.
  # 후진 스텝에는 cancel_on_arrival_m을 켜지 마세요 -- 짧게 서면 칸에 덜 들어갑니다.
  t_left_route:
    - {type: drive, course: t_left, until: t_left_spot, controller: ReverseFollowPath,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: t_left, until: t_left_end, controller: ForwardFollowPath}
  t_right_route:
    - {type: drive, course: t_right, until: t_right_spot, controller: ReverseFollowPath,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: t_right, until: t_right_end, controller: ForwardFollowPath}

  # 평행 주차. p_up만 진입 스텝이 하나 더 있습니다(녹화가 전진 -> 후진 -> 전진).
  # 진입 스텝의 cancel_on_arrival_m는 정지선(0.4)보다 작게 잡습니다: 진입에서 덜 간
  # 거리가 그대로 칸 안 정지 오차에 더해집니다.
  p_up_route:
    - {type: drive, course: p_up, until: p_up_entry, controller: ForwardFollowPath,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.15, decel_profile_a: 1.5}
    - {type: drive, course: p_up, until: p_up_spot, controller: ReverseFollowPath,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: p_up, until: p_up_end, controller: ForwardFollowPath}
  p_down_route:
    - {type: drive, course: p_down, until: p_down_spot, controller: ReverseFollowPath,
       reverse: true, goal_checker: park_goal_checker}
    - {type: stop, duration_s: 3.0}
    - {type: drive, course: p_down, until: p_down_end, controller: ForwardFollowPath}

  # 마지막 차선. 여기서 끝나면 미션 종료입니다([15]가 main의 마지막 스텝입니다).
  end_left_route:
    - {type: drive, course: end_left, until: end_left_end, controller: ForwardFollowPath,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
  end_right_route:
    - {type: drive, course: end_right, until: end_right_end, controller: ForwardFollowPath,
       goal_checker: precise_goal_checker, cancel_on_arrival_m: 0.4, decel_profile_a: 2.0}
