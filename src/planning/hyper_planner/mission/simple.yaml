# 코스 한 바퀴 -- mission_manager_node가 읽습니다.
#
# 미션이랄 게 없는 미션입니다. 코스 전체를 골 하나로 보내 끝까지 달립니다.
# 정지도, 신호도, 주차도 없습니다. 컨트롤러 튜닝이나 코스 재녹화 직후의 확인처럼
# "일단 한 바퀴 돌려 보고 싶다"는 용도입니다.
#
# 예전에 follow_path_client_node가 하던 일이 이것입니다. 그 노드는 CSV 로딩과 경로
# 다듬기를 자기 사본으로 들고 있었지만, 여기서는 mission_manager가 같은 코드
# (path_loader.hpp)로 처리하므로 실주행과 완전히 같은 경로가 나갑니다.
#
# 실행:
#   ros2 launch hyper_planner nav2_controller.launch.py   # 액션 서버가 먼저 떠 있어야 합니다
#   ros2 launch hyper_planner mission.launch.py mission:=simple
#   ros2 service call /mission_manager/start std_srvs/srv/Trigger

label_snap_tolerance_m: 1.0

courses:
  main:
    # ** 다른 코스를 한 바퀴 돌려 보려면 이 한 줄만 바꾸세요. **
    # 상대 경로는 waypoints_dir(기본 hyper_waypoint/waypoints) 기준입니다 --
    # 예: track/common_1.csv, school/test.csv.
    #
    # 아래 course_end가 `last`라 어느 CSV로 바꿔도 그대로 맞습니다(라벨을 고칠 필요가
    # 없습니다). 다른 코스를 돌릴 때는 차를 그 CSV의 0번 행에 스폰시키세요
    # (simulation.launch.py의 x/y/Y) -- 안 그러면 리드인이 코스를 가로지릅니다.
    # 이 CSV의 0번 행: x:=-27.7312 y:=13.1854 Y:=-0.4667
    csv: track/common_1.csv

labels:
  # `last` = main 코스의 마지막 웨이포인트. 좌표가 아니라 센티널입니다
  # (mission_loader.hpp의 snap_labels).
  #
  # 여기만 좌표를 안 쓰는 이유: 이 미션은 "녹화한 데까지 다 간다"가 전부라
  # 코스마다 끝점 좌표가 달라집니다. 예전에는 코스 끝점 좌표가 박혀 있어서
  # 위 csv를 다른 코스로 바꾸면 스냅 거리가 label_snap_tolerance_m를 넘어 로드가
  # 거부됐습니다. `last`는 어느 CSV로 실행하든 그대로 맞습니다.
  #
  # mission.yaml의 finish(#1354)가 아니라 CSV 끝을 쓰는 이유: finish는 "완주 판정"
  # 라벨이라 코스가 그 뒤로 더 남아 있고, 한 바퀴 돌리는 게 목적이면 녹화한 데까지
  # 다 가는 편이 맞습니다.
  course_end: last

steps:
  # cancel_on_arrival_m을 켜 두는 이유: 이게 0이면 코스 끝에서 서는 일이 전부
  # nav2의 goal checker(general, xy 0.5 m) 하나에 달립니다. RPP는 approach 감속으로
  # 기어 들어오다 한 번 끝점을 넘으면 carrot이 뒤에 놓이는데, allow_reversing과
  # use_rotate_to_heading이 둘 다 false라 되돌릴 방법이 없어 그대로 골 주변을
  # 배회하다 progress_checker(0.5 m / 15초)에 abort 됩니다. 그동안
  # mission_manager는 "0.00 m to 'course_end'"만 찍으며 구경합니다 --
  # 정지점을 지났을 때 골을 취소하는 백스톱도 cancel_on_arrival_m > 0에서만 삽니다
  # (mission_manager_node.cpp의 check_cancel_on_arrival).
  #
  # To do MPPI, Use the second one. To do RPP, Use the first one.
  - {type: drive, until: course_end, controller: FRPP,
     cancel_on_arrival_m: 0.4}
  # - {type: drive, until: course_end, cancel_on_arrival_m: 0.4}
