# Rear Intel RealSense D435i, driven by realsense2_camera's RealSenseNodeFactory component.
#
# Unlike params_elp.yaml / params_logitech.yaml (which only document their nodes' own defaults),
# this file IS loaded -- perception.launch.py passes it to the ComposableNode. realsense2_camera
# is an upstream apt package, so its config has to live here rather than in its own share dir.
#
# The node is loaded into lane_detection_container with use_intra_process_comms, which makes
# realsense2_camera publish each colour frame through a native rclcpp publisher
# (image_rcl_publisher) instead of image_transport -- the UniquePtr then reaches LaneDetection's
# rear subscription by pointer, the same zero-copy path the front ELP already uses.
/**:
  ros__parameters:
    # 848x480@30 matches what the sim models this camera as (see vehicle.xacro's rear camera), so
    # the rear BEV raster has the same source resolution in sim and on the car.
    enable_color: true
    rgb_camera.color_profile: "848,480,30"

    # Rear depth + organised point cloud on /camera_rear/depth/points. depthimage_to_laserscan
    # in perception.launch.py can also fold this into /scan_rear; the nav2 local costmap still
    # only reads the RPLidar /scan today (hyper_planner/config/nav2_controller.yaml).
    enable_depth: true
    depth_module.depth_profile: "848,480,30"
    pointcloud.enable: true
    # Texture the cloud with the colour stream. stream_filter defaults to 0 (RS2_STREAM_ANY) in
    # this driver build, which produces an XYZ-only cloud on ~/depth/points -- RViz then has no
    # RGB8 channel to colour by and falls back to Intensity/flat white. 2 == RS2_STREAM_COLOR,
    # index 0, gives XYZRGB on ~/depth/color/points instead, which is the topic
    # perception.launch.py's remap already expects and renames to /camera_rear/depth/points.
    pointcloud.stream_filter: 2
    pointcloud.stream_index_filter: 0
    align_depth.enable: false
    enable_infra1: false
    enable_infra2: false

    # The D435i's IMU is unused: /imu comes from the WitMotion WT901BLE, whose covariances are
    # tuned for this EKF in hyper_launch's sensors.launch.py. Two publishers on /imu would feed
    # ekf_local the same motion twice.
    enable_gyro: false
    enable_accel: false

    # The point cloud is stamped an optical frame the URDF does not contain, so the driver has to
    # publish its own frames or the cloud is untransformable. tf_publish_rate 0.0 makes them
    # static (latched once) rather than re-sent every cycle; they are rigid.
    #
    # camera_name is the prefix this driver (4.58) puts on EVERY frame it publishes:
    # <camera_name>_<base_frame_id> for the subtree root, <camera_name>_depth_optical_frame for
    # the cloud, and so on. It is NOT the node name -- leaving it at its default "camera" made
    # the root come out as plain "camera_link", which is the URDF's FRONT camera link
    # (vehicle.xacro), so the whole depth subtree hung off the front of the car and the cloud
    # rendered ahead of the vehicle instead of behind it. "camera_rear" keeps every driver frame
    # in its own namespace (camera_rear_link, camera_rear_depth_optical_frame, ...) and collides
    # with nothing in the URDF. perception.launch.py's rear_camera_tf_graft static publisher
    # joins camera_rear_link to the URDF's rear_camera_link, which robot_state_publisher still
    # solely owns.
    camera_name: "camera_rear"
    publish_tf: true
    tf_publish_rate: 0.0
