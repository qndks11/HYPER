# Reference copy of the Logitech C920's capture settings. Not loaded by anything at runtime --
# LogitechCameraPublisherNode declares these same values as its own parameter defaults; this file
# exists so the numbers are findable next to the rest of the vehicle's camera config, and as the
# place to point an override file at if the device ever needs different settings per run.
#
# !! image_width/image_height are load-bearing beyond this camera: hyper_lane_detection's
# config/bev_real.yaml derives the BEV focal length from the width and the lens's 70 deg
# horizontal FOV, and its near edge from the height. Changing them here means revisiting that.
/**:
    ros__parameters:
      video_device: "/dev/video_logitech"
      framerate: 30.0
      frame_id: "camera"
      image_width: 640
      image_height: 360
