navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    delay: 3.0
    # odometry.launch.py가 datum_site별로 config/datums.yaml의
    # magnetic_declination_deg/yaw_offset_deg를 덮어씁니다 (사이트마다 실제 IMU 보정값이
    # 다르므로). 이 yaml을 launch 없이 단독으로 쓸 경우에만 아래 기본값(보정 없음)이
    # 적용됩니다.
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: false
    broadcast_utm_transform: true
    base_link_frame: body_link
    publish_filtered_gps: true
    use_odometry_yaw: false
    # wait_for_datum/datum은 odometry.launch.py가 datum_site 인자(config/datums.yaml)로
    # 덮어씁니다. 이 yaml을 launch 없이 단독으로 쓸 경우에만 아래 기본값(첫 GPS fix를 원점으로
    # 사용)이 적용됩니다.
    wait_for_datum: false