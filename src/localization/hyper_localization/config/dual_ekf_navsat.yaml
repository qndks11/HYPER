navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: -0.14   # 한국(서울) 근사값. 정확한 값은 NOAA 계산기로
    yaw_offset: 1.570796327                # IMU가 북쪽=0이면 유지, 동쪽=0이면 0.0
    zero_altitude: false
    broadcast_utm_transform: true
    base_link_frame: body_link
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false