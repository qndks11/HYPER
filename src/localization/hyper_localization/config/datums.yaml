# navsat_transform 원점(datum) 목록 + 사이트별 IMU/heading 보정값.
# odometry.launch.py 실행 시 `datum_site:=sim|school|track` 인자로 선택합니다.
#
# ── heading_deg ────────────────────────────────────────────────────────────
# navsat_transform datum의 세 번째 값(robot_localization의 datum[2]). 0으로 둡니다.
# wait_for_datum: true일 때 navsat_transform은 "datum 지점에서 차량의 map 프레임
# yaw가 0"이라고 못박고 map<-UTM 회전을 datum[2]로 정합니다(navsat_transform.cpp의
# setManualDatum + computeTransform). 즉 이 값은 차량의 초기 방위가 아니라 map 축을
# ENU 대비 얼마나 돌릴지입니다. 0이면 map X=East, Y=North로 ENU와 완전히 정렬되고,
# rviz_satellite 앵커/위경도 웨이포인트 계산과도 그대로 맞습니다. 건드리지 마세요.
#
# ── 절대 방위(yaw)를 어디서 받는가 ─────────────────────────────────────────
# ekf_global이 IMU 지자기 yaw를 절대 방위로 먹습니다
# (dual_ekf_navsat.yaml의 ekf_global imu0_config 인덱스 5 = true).
# ekf_local은 그대로 false입니다 -- odom 프레임은 연속이어야 하므로 절대 방위 점프가
# 들어가면 안 되고, 그 점프는 map->odom(ekf_global)이 흡수합니다.
# 부팅 직후부터 절대 yaw가 있으므로 초기 yaw를 따로 세울 필요가 없습니다.
#
# RTK GNSS 진행방향(headMot)을 yaw로 바꿔 주던 gps_heading 노드(/imu/heading, imu1)는
# 지금 꺼져 있습니다(odometry.launch.py에서 주석 처리). 스크립트는 그대로 남아 있으니
# 되돌릴 때는 launch 주석을 풀고 yaml에 imu1 블록을 되살린 뒤 imu0의 yaw를 false로
# 내리면 됩니다(절대 방위 관측이 둘이면 서로 싸웁니다). gps_accuracy_gui의
# "Calibrate initial yaw"도 /imu/heading으로 주입하므로 지금은 EKF에 닿지 않습니다.
#
# 주의(실측): WitMotion WT901BLE가 6축(자이로+가속도) 모드로 동작하면 yaw가 자북이
# 아니라 전원 인가 시점 자세 기준으로 적분되고 +0.18deg/20s = 약 +0.5deg/min씩
# 밀립니다. 지자기 yaw를 절대 방위로 쓰려면 센서가 9축(지자기 포함) 모드인지 먼저
# 확인하고, 캘리브레이션 후 정지 상태에서 yaw가 몇 분간 고정되는지 봐야 합니다.
# 6축 모드 그대로면 map heading이 시간당 30deg씩 돌아갑니다.
#
# navsat_transform은 wait_for_datum: true면 /imu를 아예 구독하지 않으므로
# magnetic_declination_deg/yaw_offset_deg는 어디에도 영향을 주지 않습니다(0 유지).
# 지자기편차 보정이 필요하면 아래 imu_yaw_offset_deg에 같이 넣으세요.
#
# ── imu_yaw_sign / imu_yaw_offset_deg / imu_flip_gyro_z ────────────────────
# imu_enu_relay가 WitMotion 드라이버 원본(/imu/raw)을 ENU로 고쳐 /imu로 내보낼 때 쓰는 값.
#   out_yaw = imu_yaw_sign * in_yaw + radians(imu_yaw_offset_deg)
# ekf_global이 이 yaw를 절대 방위로 먹으므로 **sign/offset이 곧 map 프레임 heading**
# 입니다. 사이트마다 실측해서 채우세요. 확인법: 차를 알고 있는 방위(예: 정북)로 세우고
# `ros2 topic echo /imu --field orientation`의 yaw가 그 방위(북=90deg)로 나오는지 봅니다.
#
# imu_flip_gyro_z도 여전히 중요합니다. 지자기 yaw가 튀거나 끊기는 구간에서 yaw 전파는
# 자이로 z 적분이 짊어지므로, 부호가 반대면 차가 좌회전할 때 추정 heading이 우회전합니다.
# 실측 결과 false로 확정했습니다 -- WT901BLE의 gyro z는 이미 반시계가 양수이고,
# imu_yaw_sign(1.0, "raw yaw가 이미 반시계 증가")과도 일관됩니다.
# 재확인법: ros2 topic echo /imu --field angular_velocity  # 차를 반시계로 돌린다
# 반시계 회전에서 z가 양수여야 합니다. 음수면 imu_flip_gyro_z를 뒤집으세요.
datums:
  sim:
    latitude_deg: 37.5665
    longitude_deg: 126.9780
    heading_deg: 0.0
    magnetic_declination_deg: 0.0
    yaw_offset_deg: 0.0

  school:
    latitude_deg: 37.555047
    longitude_deg: 127.045522
    heading_deg: 0.0
    magnetic_declination_deg: 0.0
    yaw_offset_deg: 0.0
    imu_yaw_sign:  1.0
    imu_yaw_offset_deg: -91.5
    imu_flip_gyro_z: false

  track:
    latitude_deg: 37.2887947
    longitude_deg: 127.1072418
    heading_deg: 0.0
    magnetic_declination_deg: 0.0
    yaw_offset_deg: 0.0
    imu_yaw_sign: 1.0
    imu_yaw_offset_deg: -91.5
    imu_flip_gyro_z: false
