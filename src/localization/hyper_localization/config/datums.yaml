# navsat_transform 원점(datum) 목록 + 사이트별 IMU/heading 보정값.
# odometry.launch.py 실행 시 `datum_site:=school|track` 인자로 선택합니다.
#
# 시뮬레이션 전용 원점(sim)은 없어졌습니다. Gazebo 월드(hyper_gazebo의
# track.world)가 용인 트랙을 그대로 옮겨 놓은 것이라 시뮬도 실차와 같은 `track`
# 원점을 씁니다. **track.world의 <spherical_coordinates>는 아래 track 항목의
# 위경도와 반드시 같아야 합니다** -- gz navsat 센서는 월드 좌표에서 위경도를
# 만들고 navsat_transform은 datum 위경도에서 map 원점을 잡으므로, 둘이 어긋나면
# map != Gazebo 월드가 되어 웨이포인트/미션 좌표가 통째로 밀립니다.
#
# ── heading_deg ────────────────────────────────────────────────────────────
# navsat_transform datum의 세 번째 값(robot_localization의 datum[2]). 0으로 둡니다.
# wait_for_datum: true일 때 navsat_transform은 "datum 지점에서 차량의 map 프레임
# yaw가 0"이라고 못박고 map<-UTM 회전을 datum[2]로 정합니다(navsat_transform.cpp의
# setManualDatum + computeTransform). 즉 이 값은 차량의 초기 방위가 아니라 map 축을
# ENU 대비 얼마나 돌릴지입니다. 0이면 map X=East, Y=North로 ENU와 완전히 정렬되고,
# rviz_satellite 앵커/위경도 웨이포인트 계산과도 그대로 맞습니다. 건드리지 마세요.
#
# ── 절대 방위(yaw)를 어디서 받는가 ─────────────────────────────────────────
# ekf_global의 절대 방위 관측은 imu1 = /imu/heading **하나뿐**입니다
# (dual_ekf_navsat.yaml에서 imu0의 yaw는 false, odom0의 yaw도 false).
# 실차에서는 듀얼 GNSS moving-base 헤딩이 그 토픽을 냅니다
# (hyper_rtk/launch/rtk.launch.py의 navheading -> imu/heading remap).
# 시뮬레이션에서는 두 번째 안테나가 없으므로 hyper_gazebo의 sim_heading.py가
# gz IMU의 ENU yaw를 같은 토픽으로 중계합니다 -- 덕분에 이 yaml은 sim과 실차가
# 한 글자도 다르지 않습니다.
# ekf_local은 그대로 false입니다 -- odom 프레임은 연속이어야 하므로 절대 방위 점프가
# 들어가면 안 되고, 그 점프는 map->odom(ekf_global)이 흡수합니다.
# 지자기 yaw를 다시 쓰려면 imu0의 인덱스 5를 true로 올리고 imu1 블록을 지우면
# 됩니다(절대 방위 관측이 둘이면 서로 싸웁니다).
#
# 확인해야 할 것(실차): EBIMU는 센서 body frame 그대로 내보내며 축을 재매핑하지
# 않습니다(hyper_ebimu/README.md). 아는 방위로 차를 세우고
# `ros2 topic echo /imu --field orientation`의 yaw가 그 방위(북=90deg)로 나오는지,
# 차를 반시계로 돌릴 때 `--field angular_velocity`의 z가 양수인지 보세요.
#
# navsat_transform은 wait_for_datum: true면 /imu를 아예 구독하지 않으므로
# magnetic_declination_deg/yaw_offset_deg는 어디에도 영향을 주지 않습니다(0 유지).
#
# ── imu_yaw_sign / imu_yaw_offset_deg / imu_flip_gyro_z (현재 미사용) ──────
# imu_enu_relay(WitMotion WT901BLE 전용)가 /imu/raw를 ENU로 고쳐 /imu로 내보낼 때 쓰던 값:
#   out_yaw = imu_yaw_sign * in_yaw + radians(imu_yaw_offset_deg)
# WitMotion을 더 이상 쓰지 않으므로(sensors.launch.py는 hyper_ebimu를 띄웁니다) relay는
# 주석 처리돼 있고 이 값들도 지금은 아무 데도 안 읽힙니다. 위 확인에서 EBIMU 축이
# ENU와 다르게 나오면, ebimu.yaml의 topic을 imu/raw로 바꾸고 relay를 되살려 이 값들로
# 보정할 수 있습니다(아래 값은 WT901BLE 기준 실측값이라 EBIMU에는 다시 재야 합니다).
datums:
  school:
    latitude_deg: 37.555047
    longitude_deg: 127.045522
    heading_deg: 0.0
    magnetic_declination_deg: 0.0
    yaw_offset_deg: 0.0

  track:
    latitude_deg: 37.2887947
    longitude_deg: 127.1072418
    heading_deg: 0.0
    magnetic_declination_deg: 0.0
    yaw_offset_deg: 0.0
