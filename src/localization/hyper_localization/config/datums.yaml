# navsat_transform 원점(datum) 후보 목록.
# odometry.launch.py 실행 시 `datum_site:=sim|school|track` 인자로 선택합니다.
#
# heading_deg: ENU 프레임 X축(East)이 진북(true north) 대비 얼마나 회전해 있는지(도, 시계방향).
#              보통 0으로 둡니다 -- world/실측 좌표계가 이미 East-North으로 정렬돼 있다면 그대로 둡니다.
#
# magnetic_declination_deg/yaw_offset_deg: navsat_transform이 datum의 heading에 얹어 더하는
# IMU 보정값 (robot_localization의 magnetic_declination_radians/yaw_offset과 동일, 여기서는
# 도 단위로 적어서 launch가 라디안으로 변환). IMU가 실제로 참북 기준 ENU(동쪽=0 yaw)를 직접
# 보고한다면(Gazebo 시뮬레이션처럼 지자기 모델이 없는 경우) 둘 다 0으로 둡니다. 실제 자기
# 나침반 기반 IMU를 쓴다면 자편각(NOAA 계산기 등)과 IMU 장착/컨벤션에 맞는 offset을 채우세요.
#
# sim의 latitude_deg/longitude_deg/heading_deg는 hyper_gazebo/worlds/track.world의
# <spherical_coordinates>와 반드시 일치해야 시뮬레이션 GPS 좌표와 EKF 추정치가 어긋나지
# 않습니다. magnetic_declination_deg/yaw_offset_deg는 Gazebo IMU에 지자기 모델이 없으므로
# 0/0 -- 0이 아니면 GPS 기반 위치가 datum 원점을 축으로 회전해 실제 오도메트리와 어긋나며
# ekf_global이 발산합니다.
datums:
  sim:
    latitude_deg: 37.5665
    longitude_deg: 126.9780
    heading_deg: 0.0
    magnetic_declination_deg: 0.0
    yaw_offset_deg: 0.0

  school:
    latitude_deg: 37.555047
    longitude_deg: 127.045522
    heading_deg: 0.0
    magnetic_declination_deg: -8.02
    yaw_offset_deg: 90.0

  track:
    latitude_deg: 37.2887947
    longitude_deg: 127.1072418
    heading_deg: 0.0
    magnetic_declination_deg: -8.02
    yaw_offset_deg: 90.0
