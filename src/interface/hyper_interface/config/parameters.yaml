/**:
  ros__parameters:
    # USB serial link to the Arduino, as the fixed symlink from
    # udev/99-hyper-serial.rules. Do not go back to a raw /dev/ttyUSB* number:
    # the car has three USB serial devices (RTK, the EBIMU adapter, this board)
    # and the numbering follows plug order, so the IMU and this board end up
    # fighting over ttyUSB0. See the "USB 시리얼 포트 고정" section in the
    # top-level README if the symlink is missing.
    # This board uses a CH340 USB-serial chip (it enumerates as /dev/ttyUSB*, NOT
    # /dev/ttyACM*) -- confirm with `lsusb` (look for "QinHeng Electronics CH340")
    # if the udev rule stops matching after swapping boards.
    serial_port: "/dev/tty_arduino"
    baud_rate: 115200

    # Rate at which /velocity + /steering_angle are packed and sent to the Arduino.
    # Also doubles as the watchdog "heartbeat" the Arduino's own timeout relies on
    # (see COMMAND_TIMEOUT_MS in the .ino) -- keep this well above that timeout.
    send_rate: 50.0 # [Hz]

    # If no new /velocity or /steering_angle message has arrived within this long,
    # the bridge sends zero instead of the last known command (fail-safe on a
    # dropped topic, e.g. the publishing node died or was Ctrl-C'd).
    command_timeout: 0.3 # [s]

    # Clamps applied before sending -- keep in sync with hyper_control /
    # hyper_planner's max_velocity / max_steering_angle so the Arduino never sees
    # a command outside what it was tuned for. These also define the ROS-side end
    # of the linear mapping to PWM duty on the Arduino (see hyper_motor_interface.ino).
    max_velocity: 1.0 # 저속 테스트용으로 하향. hyper_control과 동일하게 맞춤 [m/s]
    max_steering_angle: 0.5061455 # 29 deg (실측) [rad]

    # Front-to-rear axle distance, used for the bicycle-model yaw rate
    # published on /odom (see arduino_interface_node.py's _publish_odom()).
    # Measured by hand on the vehicle. Re-measure and update if the chassis
    # changes.
    wheel_base: 0.72 # [m]
