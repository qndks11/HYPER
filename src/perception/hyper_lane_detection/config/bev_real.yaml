# Bird's-eye-view geometry for the REAL vehicle's front camera (input_backend:=intra_process).
#
# The node's built-in defaults describe the *simulated* camera, so this file exists to override
# the one thing that genuinely differs: the lens. Everything else -- the ground region and the
# metric scale -- is deliberately left at the sim's values, so the BEV raster has identical
# geometry in sim and on the car and the detectors' pixel-denominated constants (LaneDetector's
# kChainStepRadius, StoplineDetector's kMinStoplineAreaPx) keep the same physical meaning in both.
#
# See GroundProjection (include/hyper_lane_detection/ground_projection.hpp) for what these mean
# and how the homography is derived from them.
/**:
  ros__parameters:
    bev:
      # Rectified intrinsics of the ELP front camera, derived from the leading 3x3 block of the
      # projection_matrix in hyper_camera/config/ELP-USBGS1200P01-KL170.yaml -- which is exactly
      # the camera matrix ElpCameraCapture remaps every frame into (cv::fisheye::
      # initUndistortRectifyMap with P's 3x3 as newK), so it is the model that describes the
      # pixels this node actually receives.
      #
      # !! Scaled by 0.5. The calibration file is measured at 1280x720, but the camera is now
      # captured at 640x360 to save power (ElpCameraPublisherNode's image_width/image_height),
      # and ElpCameraCapture rescales K/P by the capture/calibration ratio before building its
      # rectify map. These four numbers describe the pixels this node receives, so they carry the
      # same 0.5. If you ever change the capture resolution, rescale these by the same factor --
      # a stale copy here silently mis-scales every distance the BEV reports.
      #
      # These must be given explicitly rather than as a horizontal_fov, because neither
      # assumption behind the FOV shortcut holds for this lens: fx != fy, and the principal point
      # (281.7, 184.5) is nowhere near the image center (320, 180). Setting fx > 0 makes these
      # win over bev.horizontal_fov.
      fx: 62.41103050
      fy: 62.39412225
      cx: 281.71746988
      cy: 184.49891651

      # 2026-08-30 실측 반영 (지면 -> 광학중심 높이, 하향각 직접 측정).
      #
      # camera_longitudinal_offset은 직접 잰 값이 아니라 변환값입니다: 실측은 "차량 앞단
      # (범퍼)에서 카메라까지 뒤로 간 거리"(= hyper_control/parameters.yaml의 camera_setback
      # 정의와 동일, 실측 0.64 m)이고, 이 필드는 body_link 원점 기준 전방 거리라 아래 식으로
      # 변환했습니다 (body_length는 실측 1.33 m, camera_box_size는 아직 실측 전 placeholder
      # 0.05 m -- 나중에 하우징 크기를 실측하면 이 계산도 다시 해야 합니다):
      #   offset = body_length/2 - camera_box_size/2 - camera_setback
      #          = 1.33/2 - 0.05/2 - 0.64 = 0.0 m
      camera_height: 1.27             # [m] optical center above the ground (실측)
      camera_pitch: 0.192             # [rad] downward tilt (실측, 약 11도)
      camera_longitudinal_offset: 0.0   # [m] ahead of body_link's origin (위 변환식 참고)

      # Ground patch to render, in meters ahead of / either side of body_link, and the scale to
      # render it at. Same values the sim front camera uses -- see this file's header.
      near: 0.3
      far: 7.6
      half_width: 9.0
      meters_per_pixel: 0.028125
