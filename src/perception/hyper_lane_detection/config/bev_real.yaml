# Bird's-eye-view geometry for the REAL vehicle's front camera (input_backend:=intra_process).
#
# The node's built-in defaults describe the *simulated* cameras, so this file exists to override
# the one thing that genuinely differs: the lens. Everything else -- the ground region and the
# metric scale -- is deliberately left at the sim's values, so the BEV raster has identical
# geometry in sim and on the car and the detectors' pixel-denominated constants (LaneDetector's
# kChainStepRadius, StoplineDetector's kMinStoplineAreaPx) keep the same physical meaning in both.
#
# See GroundProjection (include/hyper_lane_detection/ground_projection.hpp) for what these mean
# and how the homography is derived from them.
/**:
  ros__parameters:
    bev:
      # Rectified intrinsics of the ELP front camera, copied from the leading 3x3 block of the
      # projection_matrix in hyper_camera/config/ELP-USBGS1200P01-KL170.yaml -- which is exactly
      # the camera matrix ElpCameraCapture remaps every frame into (cv::fisheye::
      # initUndistortRectifyMap with P's 3x3 as newK), so it is the model that describes the
      # pixels this node actually receives.
      #
      # These must be given explicitly rather than as a horizontal_fov, because neither
      # assumption behind the FOV shortcut holds for this lens: fx != fy, and the principal point
      # (563.4, 369.0) is nowhere near the image center (640, 360). Setting fx > 0 makes these
      # win over bev.horizontal_fov.
      fx: 124.82206099
      fy: 124.78824450
      cx: 563.43493975
      cy: 368.99783301

      # !! UNMEASURED -- these are the intended mounting pose from hyper_control's
      # parameters.yaml (camera_height / camera_pitch, and camera_setback resolved against
      # body_length), not a measurement of where the camera ended up on the built car. The
      # homography is only as correct as they are: an error here tilts or scales the whole ground
      # plane, and pitch is by far the most sensitive of the three. Measure the real mount and
      # replace these before trusting any distance this node publishes on the vehicle.
      #
      # !! When you do measure it, measure camera_height from the GROUND, not from body_link.
      # parameters.yaml's camera_height is the camera joint's z in body_link, which is a different
      # datum -- in the sim model body_link rides 0.3 m up on its wheels, so the same mount is
      # 1.2 there and 1.5 here. Taking the body_link number as a ground height is exactly the bug
      # that drew the sim overlay at 0.80x true distance; the real car has its own ride height and
      # the same trap. dx scales linearly with this number.
      camera_height: 1.2              # [m] optical center above the ground
      camera_pitch: 0.2617994         # [rad] downward tilt (15 deg)
      camera_longitudinal_offset: 0.145   # [m] ahead of body_link's origin

      # Ground patch to render, in meters ahead of / either side of body_link, and the scale to
      # render it at. Same values the sim front camera uses -- see this file's header.
      near: 0.3
      far: 7.6
      half_width: 9.0
      meters_per_pixel: 0.028125
